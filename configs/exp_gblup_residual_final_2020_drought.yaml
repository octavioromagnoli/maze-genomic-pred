# =====================================================================
# !!!  TEST FINAL EN 2020 — CIERRE, UNA SOLA MIRADA AL HOLDOUT  !!!
# gblup_residual entrena en TODO el dev (2017+2018+2019) y predice 2020 (drought).
# HP default (no barridos): honesto (los HP no vieron 2020) pero sin tunear.
# Generado desde el confirm-2019 homonimo; solo cambia el split.
# =====================================================================
experiment:
  name: gblup_residual_final_2020_drought
  description: 'TEST FINAL (cierre): gblup_residual reentrenado en TODO el dev (2017+2018+2019)
    y evaluado en 2020, GY drought. HP default (no barridos). Una sola mirada al holdout.'
seed: 575
data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: drought
cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years:
  - 2017
  - 2018
  - 2019
  holdout_test_year: null
  enforce_disjoint_lines: true
model:
  name: gblup_residual
  params:
    gblup:
      lambda_method: reml
    mlp:
      hidden_dims:
      - 128
      dropout: 0.5
      input_dropout: 0.3
      activation: relu
      batchnorm: false
      lr: 0.0005
      weight_decay: 0.001
      batch_size: 64
      max_epochs: 100
      loss: mse
      mse_weight: 0.3
      patience: null
      standardize_inputs: true
      standardize_target: true
      random_state: 575
      device: auto
bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05
artifacts:
  save_model: false
wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags:
  - gblup-residual
  - stacking
  - nn
  - gblup
  - confirm
  - train20172018
  - val2019
  - GY
  - drought
  - final2020
  - holdout
