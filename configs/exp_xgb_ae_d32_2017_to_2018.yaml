# XGBoost sobre el embedding del MEJOR AE de dim=32 (sweep eer2osdp, run f14m0ycx,
# val_bce=0.492). SELECCIÓN de HP: train 2017 -> val 2018 (inner honesto).
#
# Régimen honesto (evita winner's curse): se elige sobre 2018, NO se toca 2019. El
# reporte final va en train 2017+2018 -> val 2019 (paso aparte, notebook); 2020 sellado.
# El AE se RE-AJUSTA train-only en 2017 (regla 1) con esta receta de HP -- el mismo
# train con el que el AE fue tuneado en su sweep. Los HP de XGBoost los barre
# configs/sweep_xgb.yaml.

experiment:
  name: xgb_ae_d32_2017_to_2018
  description: >
    XGBoost sobre el embedding de dim=32 del mejor autoencoder de SNPs. Selección
    de HP entrenando con 2017 y validando en 2018 (inner honesto, sin tocar 2019).
    El AE se re-ajusta train-only en 2017. 2019 queda para el reporte y 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2018            # inner-val de selección (honesto)
  train_years: [2017]       # solo 2017
  holdout_test_year: 2020   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

# Compresor no lineal: AutoencoderReducer (regla 4: BCE, salida sigmoide; NO
# standardize antes -- rompería la binariedad). Receta = mejor AE de dim=32.
preprocess:
  autoencoder:
    latent_dim: 32
    encoder_hidden: [512]
    activation: leaky_relu
    dropout: 0.18387165752518744
    batchnorm: true
    tie_weights: true
    denoising_p: 0.027039642858767133
    l1_latent: 0.0001
    weight_decay: 0.001
    optimizer: adamw
    lr: 0.00114496151193254
    batch_size: 256
    max_epochs: 300
    patience: 30
    min_delta: 0.0001
    grad_clip: 0.0
    lr_scheduler: cosine
    val_frac: 0.1
    maf_threshold: 0.0
    device: null            # auto: cuda si hay, si no cpu
    seed: 575
    max_train_seconds: 180  # red de seguridad por re-ajuste del AE
    verbose: false

model:
  name: xgboost
  params:
    # n_estimators lo barre el sweep: con un solo año de train (2017) NO hay
    # inner-split temporal, así que XGBoost no puede early-stoppear -> el número de
    # árboles es un HP más.
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    reg_alpha: 0.0
    min_child_weight: 1
    gamma: 0.0
    n_jobs: 1                   # evita segfault nativo observado con n_jobs=-1
    random_state: 575

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [xgboost, ae, d32, dev, select, train2017, val2018, GY, optimal]
