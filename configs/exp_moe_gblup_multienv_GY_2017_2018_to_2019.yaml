# MoE RUTEADO EN ESPACIO GBLUP, MULTI-AMBIENTE (GY optimal+drought) — fold honesto 2019.
#
# Variante del MoE hard (moe_multitask, PCA+GMM, hard top-1, experto sobre el fenotipo crudo).
# Tres cambios (ver src/models/moe_gblup_multitask.py):
#   1. Espacio de ruteo = breeding values del GBLUP (û, un GBLUP por ambiente, train-only), no PCA.
#   2. Target de los expertos = residuo del GBLUP (y - û); la prediccion final es û + salida_experto.
#   3. Ruteo soft en û: KNN (proporcion de cluster entre los K vecinos de train) o temperatura del GMM.
#
# El moe_multitask original queda intacto para comparar. BASELINES a batir: GBLUP-drought y el
# MoE hard. Portada = drought (cover_env). Todo train-only por fold (regla 1); û de test = GBLUP
# aplicado sobre genotipos (sin fenotipos de test). Fold honesto: train 2017+2018 -> val 2019,
# 2020 sellado (regla 3).

experiment:
  name: moe_gblup_multienv_GY_2017_2018_to_2019
  description: >
    MoE multi-ambiente para GY ruteado en el espacio de breeding values del GBLUP (û). Un GBLUP por
    ambiente (train-only) arma û; el GMM clusteriza û (pocas dims => no colapsa) y cada experto (un
    ensemble multitask por cluster) predice el residuo y-û sobre los SNPs. Ruteo soft (KNN sobre û).
    Prediccion final = û + mezcla de residuos. Train 2017+2018 -> val 2019 (honesto). 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true            # un trait, varios ambientes como cabezas (NO usar data.targets)
  target: GY                # trait unico
  envs: [optimal, drought]  # una cabeza por ambiente = una columna de û (orden = columnas de Y)
  cover_env: drought        # ambiente de PORTADA (pearson_r_GY del reporte = pearson de esta cabeza)

cv:
  scheme: fixed_temporal
  val_year: 2019
  train_years: [2017, 2018]
  holdout_test_year: 2020   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

# GBLUPs, GMM/KNN y cada experto hacen su preprocesamiento train-only DENTRO de fit (regla 1).
# save/load overridean torch (experts) + joblib (GBLUPs/GMM/KNN/calibraciones).

model:
  name: moe_gblup_multitask
  params:
    gating:                     # GBLUP -> û -> GMM/KNN (train-only) para rutear
      gblup:
        lambda_method: reml     # componentes de varianza por REML (una eigen-descomp por ambiente)
      standardize: true         # z-score de las columnas de û antes de GMM/KNN
      k: 4                      # nº de clusters GMM sobre û
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 150     # cluster chico => sin experto propio (usa fallback)
      global_fallback: true
      random_state: 575
      routing: knn              # "knn" | "gmm_temperature"
      k_neighbors: 30           # K vecinos de train en û (routing=knn)
      temperature: 1.0          # τ de las responsabilidades del GMM (routing=gmm_temperature)
    expert:                     # EnsembleMultitaskRegressor MULTI-AMBIENTE por cluster (predice residuo)
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]       # tronco NO-LINEAL (corrige lo que el GBLUP dejo sin explicar)
        dropout: 0.5
        input_dropout: 0.3
        activation: relu
        batchnorm: false
        lr: 0.0005
        weight_decay: 0.001
        batch_size: 64
        max_epochs: 100
        loss: pearson            # la escala se recupera con la calibracion OLS del experto
        loss_weights:            # claves = trait_ambiente (pesos iguales por cabeza)
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, gblup-routed, residual, soft-knn, multienv, multitask, nn, pytorch, gmm, train2017-2018, val2019, GY, optimal, drought]
