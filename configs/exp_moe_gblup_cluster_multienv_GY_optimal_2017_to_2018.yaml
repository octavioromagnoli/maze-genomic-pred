# MoE HARD MULTI-AMBIENTE (GY optimal+drought, PORTADA OPTIMAL) con CLUSTERING SOBRE PREDICCIONES
# GBLUP — CONFIG BASE del sweep. Gemelo multi-ambiente de exp_moe_gblup_cluster_2017_to_2018: en vez
# de traits GY+PH+AD, las cabezas son el MISMO trait GY en cada ambiente (GY_optimal, GY_drought;
# tronco compartido, una cabeza por ambiente). El gating clusteriza el espacio de predicciones GBLUP
# por cabeza ([GY_opt_hat, GY_dro_hat]) — train-only, supervisado, de baja dimension.
#
# PORTADA = OPTIMAL (cover_env: optimal => pearson_r_GY del sweep = cabeza OPTIMAL en val 2018).
#
# ROBUSTEZ (clave del pedido): NO hay clustering fijo. Ensamble de n_seeds miembros; por seed un GMM
# propio (clustering distinto) + una red multi-ambiente por cluster, y se promedian (z-scoreadas) las
# predicciones. Salvaguardas p>>n: min_cluster_size + global fallback (red sobre todo el train).
#
# BASELINE HONESTO a batir: el multienv GLOBAL (mismo expert.inner, sin gating) y GBLUP.
# SELECCION HONESTA: train 2017 -> val 2018 (clavado aca), sin tocar 2019 (regla 3). El reporte final
# (reentrenar 2017+2018 -> 2019) se hace aparte con los HP ganadores; 2020 sellado. Lo barre
# configs/sweep_moe_gblup_cluster_multienv_optimal.yaml. NO tocar cv.* ni data.* (reglas 2 y 3).
#
#   python scripts/train.py --config configs/exp_moe_gblup_cluster_multienv_GY_optimal_2017_to_2018.yaml

experiment:
  name: moe_gblup_cluster_multienv_GY_optimal_2017_to_2018
  description: >
    MoE hard multi-ambiente GY (cabezas optimal+drought), portada OPTIMAL, clusterizando las
    predicciones GBLUP por cabeza (train-only) con GMM; una red por cluster + fallback global.
    Ensamble sobre n_seeds miembros que re-clusterizan (robustez). Train 2017 -> val 2018. 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true            # un trait, varios ambientes como cabezas (NO usar data.targets)
  target: GY                # trait unico
  envs: [optimal, drought]  # una cabeza por ambiente (orden = columnas de Y)
  cover_env: optimal        # PORTADA = optimal (pearson_r_GY del sweep = cabeza optimal)

cv:
  scheme: fixed_temporal
  val_year: 2018            # inner-val de seleccion (honesto)
  train_years: [2017]       # solo 2017
  holdout_test_year: 2020   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

# El gating (GBLUP + GMM) y cada red hacen su preprocesamiento train-only DENTRO de fit (regla 1).

model:
  name: moe_gblup_cluster
  params:
    gating:                       # clustering sobre predicciones GBLUP (train-only)
      mode: gblup                  # gblup | pca_gblup | pca
      gblup_targets: null          # null => usa las dos cabezas GY_optimal + GY_drought
      gblup_lambda_method: reml    # determinista y barato (una eigendescomposicion por cabeza)
      gblup_standardize: true      # z-score por-cabeza de las predicciones antes de clusterizar
      k: 3                         # nº de clusters GMM (HP del sweep)
      covariance_type: full        # full | diag | tied | spherical
      reg_covar: 1.0e-6            # estabilidad numerica del GMM
      n_init: 1                    # reinicios del EM
      min_cluster_size: 150        # cluster con menos filas => sin red propia (usa fallback)
      global_fallback: true        # red sobre TODO el train, para clusters chicos/vacios
    ensemble:                     # ensamble sobre clusterings (robustez)
      n_seeds: 5                   # nº de (clustering + red) a promediar
      seed_step: 1000              # seed_s = inner.random_state + s*seed_step
    expert:
      inner:                       # params del MLPMultitaskRegressor MULTI-AMBIENTE (una red por cluster)
        hidden_dims: [128]         # tronco NO-LINEAL (la variante lineal no supera a GBLUP)
        dropout: 0.5
        input_dropout: 0.3
        activation: relu
        batchnorm: false
        lr: 0.0005
        weight_decay: 0.001
        batch_size: 64
        max_epochs: 100            # sin early stopping (un solo ano de train)
        loss: pearson              # "pearson" | "pearson_mse"
        loss_weights:              # claves = trait_ambiente; GY_optimal (portada) anclado en 1.0
          GY_optimal: 1.0
          GY_drought: 0.5          # cabeza auxiliar (el sweep la pisa en [0, 1])
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575          # seed BASE del ensemble (cada miembro: base + s*seed_step)
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false               # el sweep no guarda modelos; el final se reentrena aparte

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [moe, hard, multitask, multienv, gblup-cluster, gmm, ensemble, sweep, select, train2017, val2018, GY, optimal, drought, cover-optimal, pearson-loss]
