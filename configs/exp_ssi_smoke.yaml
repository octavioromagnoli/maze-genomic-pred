# SMOKE-TEST del camino SSI: pocas particiones, 1 composicion, grilla de lambda corta, 2 kernels,
# MTL con pocas epocas. Solo para verificar que el pipeline corre end-to-end (no es un resultado).
#
# Uso:
#   python scripts/train.py --config configs/exp_ssi_smoke.yaml

experiment:
  name: ssi_smoke_GY_drought
  description: Smoke-test del pipeline SSI (kernel aprendido) — pocas particiones, corrida rapida.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv

ssi:
  target: GY
  env: drought
  target_year: 2020
  frac_predict: 0.85
  n_partitions: 1           # smoke: una particion minima
  seed: 575
  n_jobs: 1
  max_train_size: 60        # solo smoke: submuestrea TS para probar integracion rapido
  max_predict_size: 24      # solo smoke: submuestrea PS para probar integracion rapido
  compositions:             # smoke: una sola composicion, submuestreada por max_train_size
    - {name: "2019", years: [2019]}
  pcts: [0]                 # smoke funcional; no interpretar como resultado
  kernels:
    - {kind: G}             # baseline aditivo
    - {kind: gram_emb}      # aporte (embedding MTL)
  lambda:
    n_lambda: 3             # grilla minima
    lambda_min_ratio: 0.1
    cv_folds: 2
  solver:
    max_iter: 40
    tol: 1.0e-4
  embedding:
    mtl_config: configs/exp_mlp_multitask_2017_to_2018_drought.yaml
    overrides:
      model.params.max_epochs: 1   # MTL rapida para el smoke

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [ssi, smoke]
