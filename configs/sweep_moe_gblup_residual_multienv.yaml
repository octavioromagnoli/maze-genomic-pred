# Sweep BAYESIANO del MoE hard con GBLUP backbone (moe_gblup_residual_multitask), multi-ambiente
# GY (optimal+drought), optimizando pearson_r_GY (= cabeza drought, cover_env del config base).
#
# Ruteo PCA+GMM hard top-1 IDENTICO al hard MoE (mismo espacio de barrido de gating); lo que cambia
# es que los expertos predicen el RESIDUO y-û del GBLUP en vez del fenotipo crudo. Hipotesis del
# sweep: el residuo es un target de MENOR VARIANZA que el fenotipo, asi que los expertos
# probablemente quieran MENOS regularizacion / mas capacidad que el HP ganador del hard crudo
# (dropout 0.22, wd 3.9e-5). Por eso el barrido de dropout arranca en 0 y el de max_epochs llega
# alto. Objetivo: cerrar los ~0.046 de Pearson-drought que separan esta variante (0.323) del hard
# crudo (0.369) en el fold 2019 — a favor de esta por su RMSE calibrada.
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base, sin tocar 2019). El reporte
# final (reentrenar 2017+2018 -> 2019 con el HP ganador) es un paso posterior; 2020 sellado.
# El backbone GBLUP (gating.gblup.lambda_method: reml) NO se barre (fijo en el base, barato y estable).
#
# COSTO: cada trial entrena (k + 1) * n_models redes + (nº ambientes) GBLUPs. n_models/k acotados.
#
# Uso:
#   wandb sweep configs/sweep_moe_gblup_residual_multienv.yaml      # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en screen

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_moe_gblup_residual_multienv_pearsonGY_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 120

metric:
  name: pearson_r_GY
  goal: maximize

parameters:
  # --- gating: PCA + GMM (mismo espacio que el hard MoE; el ruteo es identico) ---
  model.params.gating.pca_n_components:
    values: [20, 50, 100, 200]
  model.params.gating.k:
    values: [2, 3, 4]
  model.params.gating.covariance_type:
    values: [full, diag, tied]
  model.params.gating.min_cluster_size:
    values: [100, 150, 250]
  # --- experts: ensemble por cluster ---
  model.params.expert.n_models:
    values: [3, 5]
  # --- experts: arquitectura (tronco NO-LINEAL; corrige el residuo que el GBLUP dejo) ---
  model.params.expert.inner.hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [128, 64]
      - [256, 128]
  model.params.expert.inner.activation:
    values: [relu, gelu, leaky_relu]
  model.params.expert.inner.batchnorm:
    values: [true, false]
  # --- experts: regularizacion (residuo = target de menor varianza => explorar hacia MENOS reg) ---
  model.params.expert.inner.dropout:
    distribution: uniform
    min: 0.0
    max: 0.6
  model.params.expert.inner.input_dropout:
    distribution: uniform
    min: 0.0
    max: 0.4
  model.params.expert.inner.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  # --- experts: optimizacion ---
  model.params.expert.inner.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  model.params.expert.inner.batch_size:
    values: [0, 32, 64]
  model.params.expert.inner.max_epochs:
    distribution: int_uniform
    min: 20
    max: 300

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_moe_gblup_residual_multienv_GY_2017_to_2018.yaml
