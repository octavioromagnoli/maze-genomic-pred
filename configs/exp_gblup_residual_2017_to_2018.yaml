# STACKING ADITIVO GBLUP + RED sobre el residual (GY - y_gblup) — CONFIG BASE del sweep.
# GBLUP (base lineal, REML) se entrena en el train del fold; una red modela su residual y la
# predicción final es la SUMA (gblup + red). Captura solo lo no-lineal que GBLUP no explica.
#
# SELECCIÓN HONESTA de HP: train 2017 -> val 2018 (clavado acá). Se elige sobre 2018 sin tocar
# 2019, así no hay winner's curse sobre el set de reporte. El reporte final (reentrenar
# 2017+2018 -> 2019, comparado contra GBLUP) se hace en el notebook con los HP ganadores; 2020
# queda sellado.
#
# Lo barre configs/sweep_gblup_residual.yaml (HP de la red en model.params.mlp.*). NO tocar
# cv.* ni data.* (reglas 2 y 3): el split vive acá.
#
# LOSS = MSE (o pearson_mse): la predicción es ADITIVA, así que la red debe predecir el residual
# en ESCALA CALIBRADA. "pearson" pura es invariante a afines -> descalibraría la suma. Por eso el
# sweep barre solo [mse, pearson_mse], nunca pearson pura.
#
# Con UN solo año de train (2017) NO hay inner-split temporal -> NO hay early stopping: la red
# entrena `max_epochs` fijo y `max_epochs` pasa a ser un HP del sweep. patience: null.

experiment:
  name: gblup_residual_2017_to_2018
  description: >
    Stacking aditivo GBLUP + red sobre el residual (GY - y_gblup), GY en ambiente optimo.
    Train 2017 -> val 2018 para la SELECCION de hiperparametros (inner honesto, sin tocar
    2019). GBLUP con lambda_0 por REML (base lineal fija y determinista en cada trial); la red
    modela el residual con loss mse/pearson_mse y la prediccion final suma ambas. Sin early
    stopping (un solo ano de train): max_epochs es un HP del sweep. 2019 queda para el reporte
    (reentrenando 2017+2018 en el notebook) y 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2018            # inner-val de seleccion (honesto)
  train_years: [2017]       # solo 2017 (GBLUP y red se entrenan aca)
  holdout_test_year: 2020   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

# OJO: este modelo hace su preprocesamiento train-only DENTRO de fit (regla 1): GBLUP estandariza
# marcadores con stats de train; el MLP z-scorea inputs y el residual con stats de train. NO se
# usa el bloque `preprocess:` (GBLUP quiere marcadores crudos) y el modelo overridea save/load.

model:
  name: gblup_residual
  params:
    gblup:
      lambda_method: reml       # base lineal determinista y estable a lo largo del sweep
    mlp:
      # --- arquitectura / regularizacion (valores base; el sweep los pisa) ---
      hidden_dims: [128]
      dropout: 0.5
      input_dropout: 0.3
      activation: relu
      batchnorm: false
      # --- optimizacion ---
      lr: 0.0005
      weight_decay: 0.001
      batch_size: 64            # el sweep barre batch_size (incluye full-batch = 0)
      max_epochs: 100           # HP del sweep (no hay early stopping con 1 ano de train)
      # --- perdida sobre el RESIDUAL: mse calibra la escala (la suma es aditiva) ---
      loss: mse                 # "mse" | "pearson_mse" (NUNCA "pearson" pura)
      mse_weight: 0.3           # solo si loss=pearson_mse; ignorado con loss=mse
      patience: null            # sin early stopping: con un solo ano no hay inner-split
      standardize_inputs: true
      standardize_target: true  # z-score del residual train-only
      random_state: 575         # seed del RNG de torch (init de pesos); NO se barre
      device: auto              # usa GPU si hay (acelera el sweep), cae a cpu

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false             # el sweep no guarda modelos; el final se reentrena aparte

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [gblup-residual, stacking, nn, gblup, sweep, select, train2017, val2018, GY, optimal]
