# GBLUP en validación temporal expanding-window (forward chaining) sobre dev.
# Folds de SCORING (entran en pearson_r_mean -> lo que optimiza el sweep):
#   train 2017 -> val 2018  y  train 2017+2018 -> val 2019
# Fold de DIAGNÓSTICO (se reporta y loguea, NO puntúa):
#   train 2018 -> val 2019  (train de 1 año, para comparar contra el de 2 años)
# 2020 sigue sellado.

experiment:
  name: gblup_expanding_dev
  description: >
    GBLUP evaluado en expanding window temporal para medir robustez entre años.
    El fold 2018->2019 se reporta como diagnóstico pero no entra en el resumen
    que optimizan los sweeps. 2020 queda intocable.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal

cv:
  scheme: expanding_temporal
  val_years: [2018, 2019]                      # scoring: train = años previos (expanding)
  report_only:
    - {val_year: 2019, train_years: [2018]}    # diagnóstico (train 1 año), NO puntúa
  holdout_test_year: 2020                       # sellado, excluido de todo fold
  enforce_disjoint_lines: true

preprocess:
  standardize: true          # z-score por-SNP con stats de TRAIN, antes del PCA
  pca:
    n_components: 100         # <-- la dimensión a barrer (la pisa el sweep)
    whiten: false            # GBLUP re-estandariza internamente; whiten es casi redundante
    svd_solver: full         # determinista; para dims altas 'randomized' es más rápido

model:
  name: gblup
  params:
    lambda_method: reml

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [gblup, expanding, dev, robustez]
