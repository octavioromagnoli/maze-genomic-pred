# CONFIG BASE del sweep de TEMPERATURA de la variante PCA-sobre-G (moe_gpca_multitask) — SELECCION
# honesta 2017 -> 2018. Todo el HP fijo (ganador u1kgstvr, que dio drought 2019 = 0.323 a τ=1); el
# sweep (sweep_moe_gpca_temperature_multienv.yaml) barre SOLO model.params.gating.temperature y
# optimiza pearson_r_GY (= drought). Aisla el efecto del ruteo soft (τ): a τ=1 el GMM rutea ~hard
# (clusters bien separados), τ>1 lo ablanda hacia la mezcla uniforme.

experiment:
  name: moe_gpca_multienv_GY_2017_to_2018
  description: >
    Config base del sweep de temperatura de la variante PCA-sobre-G (clustering por PCA sobre G,
    backbone GBLUP + residuo, ruteo soft por temperatura del GMM). Seleccion train 2017 -> val 2018.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true
  target: GY
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2018
  train_years: [2017]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: moe_gpca_multitask
  params:
    gating:
      gblup:
        lambda_method: reml
      pca_n_components: 100
      whiten: true
      k: 4
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 250
      global_fallback: true
      random_state: 575
      temperature: 1.0          # lo barre el sweep
    expert:
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [moe, gpca, pca-on-G, gblup-backbone, residual, gmm, temperature, sweep, select, train2017, val2018, GY, optimal, drought]
