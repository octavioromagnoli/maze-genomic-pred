# Sweep BAYESIANO del MoE HARD 6 CABEZAS (GY/PH/AD x optimal/drought, PORTADA GY_OPTIMAL) con
# CLUSTERING SOBRE PREDICCIONES GBLUP, optimizando PEARSON DE LA CABEZA GY_OPTIMAL (pearson_r_GY, con
# data.cover: GY_optimal en el config base). Gemelo de los sweeps gblup-cluster anteriores: MISMOS
# rangos de gating GMM y de la red por cluster; el ESPACIO de clustering es fijo (predicciones GBLUP
# de las 6 cabezas) y el ensamble sobre seeds (n_seeds) queda FIJO (robustez). Como hay 6 cabezas,
# se barren los pesos de las 5 cabezas AUXILIARES (GY_optimal anclado en 1.0).
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base, sin tocar 2019). El reporte
# final (reentrenar 2017+2018 -> 2019 vs GBLUP-optimal / red global de 6 cabezas) es un paso
# posterior con los HP ganadores; 2020 sellado.
#
# COSTO: cada trial ajusta 6 GBLUP (deterministas, una vez) + n_seeds*(k+1) redes de 6 cabezas. El
# run_cap es mas alto que en los gemelos por las 5 dims extra de loss_weights.
#
# Uso:
#   wandb login
#   wandb sweep configs/sweep_moe_gblup_cluster_mtme_optimal.yaml     # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en tmux/screen

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_moe_gblup_cluster_mtme_pearsonGYoptimal_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 100

metric:
  name: pearson_r_GY          # cabeza GY_optimal (data.cover: GY_optimal del config base)
  goal: maximize

parameters:
  # --- gating: GMM sobre las 6 predicciones GBLUP ---
  model.params.gating.k:
    values: [2, 3, 4]
  model.params.gating.covariance_type:
    values: [full, diag, tied]
  model.params.gating.min_cluster_size:
    values: [100, 150, 200]
  # --- red por cluster: arquitectura del tronco (mlp_multitask de 6 cabezas) ---
  model.params.expert.inner.hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [128, 64]
      - [256, 128]
  model.params.expert.inner.activation:
    values: [relu, gelu, leaky_relu]
  model.params.expert.inner.batchnorm:
    values: [true, false]
  # --- red por cluster: regularizacion (clave en p >> n, mas aun con subsets chicos por cluster) ---
  model.params.expert.inner.dropout:
    distribution: uniform
    min: 0.0
    max: 0.7
  model.params.expert.inner.input_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  model.params.expert.inner.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  # --- red por cluster: optimizacion ---
  model.params.expert.inner.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  model.params.expert.inner.batch_size:
    values: [0, 32, 64]           # 0 = full-batch
  model.params.expert.inner.max_epochs:
    distribution: int_uniform
    min: 20
    max: 300
  # --- pesos de las 5 cabezas AUXILIARES (GY_optimal anclado en 1.0 en el config base) ---
  model.params.expert.inner.loss_weights.GY_drought:
    distribution: uniform
    min: 0.0
    max: 1.0
  model.params.expert.inner.loss_weights.PH_optimal:
    distribution: uniform
    min: 0.0
    max: 1.0
  model.params.expert.inner.loss_weights.PH_drought:
    distribution: uniform
    min: 0.0
    max: 1.0
  model.params.expert.inner.loss_weights.AD_optimal:
    distribution: uniform
    min: 0.0
    max: 1.0
  model.params.expert.inner.loss_weights.AD_drought:
    distribution: uniform
    min: 0.0
    max: 1.0

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_moe_gblup_cluster_mtme_GY_optimal_2017_to_2018.yaml
