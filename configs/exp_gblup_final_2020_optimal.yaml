# =====================================================================
# !!!  TEST FINAL EN 2020 — CIERRE, UNA SOLA MIRADA AL HOLDOUT  !!!
# gblup entrena en TODO el dev (2017+2018+2019) y predice 2020 (optimal).
# HP default (no barridos): honesto (los HP no vieron 2020) pero sin tunear.
# Generado desde el confirm-2019 homonimo; solo cambia el split.
# =====================================================================
experiment:
  name: gblup_final_2020_optimal
  description: 'TEST FINAL (cierre): gblup reentrenado en TODO el dev (2017+2018+2019)
    y evaluado en 2020, GY optimal. HP default (no barridos). Una sola mirada al holdout.'
seed: 575
data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal
cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years:
  - 2017
  - 2018
  - 2019
  holdout_test_year: null
  enforce_disjoint_lines: true
model:
  name: gblup
  params:
    lambda_method: reml
bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05
artifacts:
  save_model: false
wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags:
  - gblup
  - reml
  - dev
  - train2017-2018
  - val2019
  - final2020
  - holdout
