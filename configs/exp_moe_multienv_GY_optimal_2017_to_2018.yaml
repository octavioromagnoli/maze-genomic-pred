# MIXTURE OF EXPERTS MULTITASK MULTI-AMBIENTE (GY optimal+drought), PORTADA OPTIMAL — CONFIG BASE.
#
# GEMELO del exp_moe_multienv_GY (hard, portada drought): MISMO modelo, MISMOS datos, MISMO fold.
# LO UNICO que cambia es `cover_env: optimal` => el sweep selecciona HP mirando la cabeza OPTIMAL
# (pearson_r_GY = pearson de GY_optimal en val 2018), no la de drought. Sirve para la tabla
# simetrica {soft,hard} x {optimal,drought} del informe.
#
# CAVEAT (bitacora): en optimal GBLUP esta casi en el techo (~0.31 vs mejor NN 0.268). Este sweep
# es POR COMPLETITUD; NO se espera que le gane a GBLUP-optimal. El premio real esta en drought.
#
# Gating PCA+GMM (train-only) + un EnsembleMultitaskRegressor MULTI-AMBIENTE por cluster (tronco
# compartido + una cabeza por ambiente: GY_optimal, GY_drought). loss_weights por cabeza en 1.0/1.0
# y NO se barren (igual que la variante drought). SELECCION HONESTA: train 2017 -> val 2018 (clavado
# aca), sin tocar 2019 (regla 3). Lo barre configs/sweep_moe_multienv_optimal.yaml.

experiment:
  name: moe_multienv_GY_optimal_2017_to_2018
  description: >
    Mixture of experts multitask MULTI-AMBIENTE para GY (cabezas optimal+drought), seleccionando por
    la cabeza OPTIMAL (cover_env: optimal). Gemelo del multienv drought para la tabla simetrica del
    informe. Entrenado con 2017 y validado en 2018 para la seleccion de HP. 2019 reporte, 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true            # un trait, varios ambientes como cabezas (NO usar data.targets)
  target: GY                # trait unico
  envs: [optimal, drought]  # una cabeza por ambiente (orden = columnas de Y)
  cover_env: optimal        # PORTADA = optimal (pearson_r_GY del sweep = cabeza optimal)

cv:
  scheme: fixed_temporal
  val_year: 2018            # inner-val de seleccion (honesto)
  train_years: [2017]       # solo 2017
  holdout_test_year: 2020   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

# El gating (PCA+GMM) y cada expert hacen su preprocesamiento train-only DENTRO de fit (regla 1).

model:
  name: moe_multitask
  params:
    gating:                     # PCA + GMM (train-only) para rutear
      pca_n_components: 50
      standardize: true
      whiten: true
      k: 3
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 150
      global_fallback: true
      random_state: 575
    expert:                     # EnsembleMultitaskRegressor MULTI-AMBIENTE por cluster
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]       # tronco NO-LINEAL (la variante lineal no supera a GBLUP)
        dropout: 0.5
        input_dropout: 0.3
        activation: relu
        batchnorm: false
        lr: 0.0005
        weight_decay: 0.001
        batch_size: 64
        max_epochs: 100
        loss: pearson
        loss_weights:            # claves = trait_ambiente (pesos iguales por cabeza; NO se barren)
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [moe, multitask, multienv, nn, pytorch, pca, gmm, sweep, select, train2017, val2018, GY, optimal, drought, cover-optimal, pearson-loss]
