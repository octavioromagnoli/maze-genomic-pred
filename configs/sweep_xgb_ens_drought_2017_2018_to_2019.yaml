# Sweep BAYESIANO ROBUSTO de XGBoost en SEQUIA — SELECCION EN 2019 (para el modelo FINAL de 2020).
# Identico a sweep_xgb_ens_drought.yaml (misma grilla de HP) salvo que apunta al config base que
# entrena con 2017+2018 y valida en 2019 (exp_xgb_ens_drought_2017_2018_to_2019.yaml). Cada trial
# evalua un ENSEMBLE de n_models seeds y optimiza el pearson_r_mean DEL ENSEMBLE en val 2019 (evita
# el winner's curse del single-seed). Los HP se barren en model.params.inner.*.
#
# POR QUE OTRO SWEEP: el sweep que ya esta selecciona en 2018 (para reportar 2019). Este selecciona
# en 2019 (train 2017+2018), que es lo que hay que congelar para el modelo FINAL de 2020 (que luego
# reentrena en 2017+2018+2019). 2020 NUNCA se toca en la seleccion.
#
# Uso:
#   wandb sweep configs/sweep_xgb_ens_drought_2017_2018_to_2019.yaml         # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en tmux

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_xgb_ens_drought_pearson_2017_2018_to_2019
program: scripts/train.py
method: bayes
run_cap: 60

metric:
  name: pearson_r_mean        # Pearson del ENSEMBLE de XGB en val 2019 (estable)
  goal: maximize

parameters:
  model.params.inner.n_estimators:
    distribution: int_uniform
    min: 50
    max: 1200
  model.params.inner.max_depth:
    values: [2, 3, 4, 5, 6]
  model.params.inner.learning_rate:
    distribution: log_uniform_values
    min: 0.005
    max: 0.3
  model.params.inner.subsample:
    distribution: uniform
    min: 0.5
    max: 1.0
  model.params.inner.colsample_bytree:
    distribution: uniform
    min: 0.3
    max: 1.0
  model.params.inner.reg_lambda:
    distribution: log_uniform_values
    min: 0.001
    max: 10.0
  model.params.inner.reg_alpha:
    values: [0.0, 0.001, 0.01, 0.1, 1.0]
  model.params.inner.min_child_weight:
    values: [1, 3, 5, 10]
  model.params.inner.gamma:
    values: [0.0, 0.1, 0.5, 1.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_xgb_ens_drought_2017_2018_to_2019.yaml
