# MoE con CLUSTERING por PCA sobre la matriz de parentesco G + backbone GBLUP (residuo) + ruteo soft
# por temperatura del GMM (proyectando G_test,train en las componentes de PCA). Fold honesto 2019, HP
# ganador. Comparable directo a las otras variantes en el mismo fold:
#   - MoE hard PCA(SNPs)+GMM crudo:      drought 2019 = 0.369
#   - MoE hard PCA(SNPs)+GMM + residuo:  drought 2019 = 0.323
#   - MoE espectral crudo (soft KNN-G):  drought 2019 = 0.293
#   - GBLUP:                             drought 2019 = 0.241
#   - MoE espectral residuo (soft KNN-G):drought 2019 = 0.237
#   - MoE ruteo-en-û soft residuo:       drought 2019 = 0.189
#
# Los 4 cambios (ver src/models/moe_gpca_multitask.py):
#   1. Clustering = PCA sobre G_train (no sobre SNPs crudos) + GMM en ese espacio.
#   2. Target = residuo del GBLUP; prediccion final = û + salida_MoE.
#   3. Ruteo soft: proyectar G_test,train en la PCA de train -> GMM -> temperatura antes del softmax.
#   4. Anti-leakage: GBLUP, G_train, PCA y GMM solo con train; û de test via G_test,train (genotipos).

experiment:
  name: moe_gpca_multienv_GY_2017_2018_to_2019
  description: >
    MoE con clustering por PCA sobre G, backbone GBLUP + expertos sobre el residuo, ruteo soft por
    temperatura del GMM proyectando G_test,train. HP de expert ganador u1kgstvr. Train 2017+2018 -> val 2019.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true
  target: GY
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2019
  train_years: [2017, 2018]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: moe_gpca_multitask
  params:
    gating:                     # backbone GBLUP + PCA sobre G + GMM + temperatura
      gblup:
        lambda_method: reml
      pca_n_components: 100      # N componentes de PCA sobre G_train
      whiten: true
      k: 4                      # nº de clusters GMM = nº de expertos
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 250
      global_fallback: true
      random_state: 575
      temperature: 1.0          # τ antes del softmax del GMM (1.0 = responsabilidades del GMM)
    expert:                     # HP ganador u1kgstvr (mismo que el hard MoE de referencia)
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, gpca, pca-on-G, gblup-backbone, residual, gmm, temperature, multienv, multitask, train2017-2018, val2019, GY, optimal, drought, winHP]
