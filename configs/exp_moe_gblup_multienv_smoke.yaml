# SMOKE del moe_gblup_multitask sobre datos reales (compute minimo): solo valida el path del harness
# (run_multitask_evaluation -> build_model -> fit/predict -> metricas). NO es un experimento real.

experiment:
  name: moe_gblup_multienv_smoke
  description: smoke test del MoE ruteado en espacio GBLUP (compute minimo).

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true
  target: GY
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2018
  train_years: [2017]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: moe_gblup_multitask
  params:
    gating:
      gblup:
        lambda_method: reml
      standardize: true
      k: 2
      min_cluster_size: 100
      global_fallback: true
      random_state: 575
      routing: knn
      k_neighbors: 10
    expert:
      n_models: 1
      seed_step: 1000
      inner:
        hidden_dims: [16]
        dropout: 0.2
        input_dropout: 0.1
        activation: relu
        lr: 0.001
        weight_decay: 0.0001
        batch_size: 128
        max_epochs: 3
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: cpu

bootstrap:
  enabled: false

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: disabled
  tags: [smoke]
