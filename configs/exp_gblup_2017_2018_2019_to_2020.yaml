# TEST FINAL 2020 de GBLUP para GY optimal.

experiment:
  name: gblup_reml_2017_2018_2019_to_2020
  description: >
    GBLUP entrenado con 2017+2018+2019 y evaluado sobre 2020 para GY optimal.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years: [2017, 2018, 2019]
  holdout_test_year: null
  enforce_disjoint_lines: true

model:
  name: gblup
  params:
    lambda_method: reml

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [gblup, reml, final2020, train201720182019, val2020, GY, optimal]
