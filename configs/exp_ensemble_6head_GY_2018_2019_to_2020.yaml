# Red multitarea (ensemble sin gating), 6 cabezas — ENTREGA: train 2018+2019 -> val 2020.
# Mismos HP que exp_ensemble_6head_GY_2017_2018_to_2019.yaml, retargeteado a 2020 para
# generar las predicciones de GY (optimal + drought) sobre las 486 líneas de 2020.

experiment:
  name: ensemble_6head_GY_2018_2019_to_2020
  description: >
    Multitask de 6 cabezas (GY/PH/AD x optimal/drought), tronco compartido + una cabeza por
    combinacion, ensemble de 5 seeds. Train 2018+2019 -> val 2020. Entrega de predicciones.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multi_trait_env: true
  targets: [GY, PH, AD]
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years: [2018, 2019]
  holdout_test_year: null
  enforce_disjoint_lines: true

model:
  name: ensemble_multitask
  params:
    n_models: 5
    seed_step: 1000
    inner:
      hidden_dims: [128]
      dropout: 0.2234
      input_dropout: 0.0327
      activation: leaky_relu
      batchnorm: false
      lr: 0.00101
      weight_decay: 3.93e-05
      batch_size: 64
      max_epochs: 133
      loss: pearson
      loss_weights:
        GY_optimal: 1.0
        GY_drought: 1.0
        PH_optimal: 1.0
        PH_drought: 1.0
        AD_optimal: 1.0
        AD_drought: 1.0
      patience: null
      standardize_inputs: true
      standardize_target: true
      random_state: 575
      device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [multitask, ensemble, 6head, 3traits, 2env, train20182019, val2020, GY, PH, AD, optimal, drought]
