# GBLUP — A1 DROUGHT. Referencia (baseline) para GY en SEQUÍA: train 2017+2018 -> predecir
# 2019. Idéntico a exp_gblup_2017_2018_to_2019.yaml salvo data.env: drought. lambda_0 por
# REML. NO toca el holdout 2020.

experiment:
  name: gblup_reml_2017_2018_to_2019_drought
  description: >
    GBLUP entrenado con 2017+2018 y evaluado sobre 2019 para GY en ambiente de SEQUIA
    (drought). lambda_0 = sigma_E^2/sigma_u^2 por REML. Baseline para comparar contra el
    MLP-drought. 2020 queda como holdout intocable.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: drought

cv:
  scheme: fixed_temporal
  val_year: 2019            # año a predecir
  train_years: [2017, 2018] # train explícito
  holdout_test_year: 2020   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

model:
  name: gblup
  params:
    lambda_method: reml

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: true
  name: gblup-reml-2017-2018-to-2019-drought
  aliases: [latest]

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [gblup, reml, dev, train2017-2018, val2019, GY, drought]
