# MoE HARD (PCA+GMM, hard top-1, experto sobre fenotipo crudo) — fold honesto 2019, HP GANADOR.
#
# Reproduce el "veredicto 2019" de la bitacora: HP ganador del sweep 87qyjrcr/u1kgstvr reentrenado
# sobre 2017+2018 y evaluado en val 2019. Numero registrado: Pearson drought = 0.369 [0.301, 0.431].
# Sirve de referencia apples-to-apples para la variante moe_gblup_multitask con el MISMO HP de expert.

experiment:
  name: moe_hard_multienv_GY_2017_2018_to_2019
  description: >
    MoE hard multi-ambiente GY con HP ganador u1kgstvr (k=4, pca=100, cov=full, min_cluster=250,
    hidden [128] leaky_relu, n_models=5). Train 2017+2018 -> val 2019. Referencia del mejor MoE hard.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true
  target: GY
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2019
  train_years: [2017, 2018]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: moe_multitask
  params:
    gating:
      pca_n_components: 100
      standardize: true
      whiten: true
      k: 4
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 250
      global_fallback: true
      random_state: 575
    expert:
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, hard, multienv, multitask, train2017-2018, val2019, GY, optimal, drought, ref]
