# MLP MULTITASK (PyTorch) — CONFIG BASE del sweep, ARM GY+PH (optimo). Tronco compartido,
# cabeza Linear(prev, 2). SELECCION HONESTA: train 2017 -> val 2018 (clavado). El sweep
# (configs/sweep_mlp_multitask_GY_PH.yaml) optimiza Pearson de GY (pearson_r_GY). Reporte final
# (2017+2018 -> 2019 vs GBLUP y MLP univariado) en el notebook con el HP ganador. 2020 sellado.
#
# Familia de 6 (3 arms x 2 ambientes): este es GY+PH optimo. patience: null (1 ano de train,
# sin early stopping; max_epochs es HP del sweep).

experiment:
  name: mlp_multitask_2017_to_2018_GY_PH
  description: >
    MLP multitask GY+PH (ambiente optimo), train 2017 -> val 2018 para la SELECCION de HP
    (inner honesto, sin tocar 2019). Perdida Pearson enmascarada y ponderada; el sweep optimiza
    Pearson de GY. 2019 para el reporte (notebook), 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  targets: [GY, PH]
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2018
  train_years: [2017]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: mlp_multitask
  params:
    hidden_dims: [128]
    dropout: 0.5
    input_dropout: 0.3
    activation: relu
    batchnorm: false
    lr: 0.0005
    weight_decay: 0.001
    batch_size: 64
    max_epochs: 100
    loss: pearson
    loss_weights:
      GY: 1.0
      PH: 0.5
    patience: null
    standardize_inputs: true
    standardize_target: true
    random_state: 575
    device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [mlp, multitask, nn, pytorch, sweep, select, train2017, val2018, GY, PH, optimal, pearson-loss]
