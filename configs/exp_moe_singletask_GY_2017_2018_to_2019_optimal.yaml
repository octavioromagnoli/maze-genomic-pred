# MoE SINGLE-TASK (PCA+GMM hard top-1, experto = ensemble de MLP single-task) — GY OPTIMAL, fold 2019.
# A/B directo contra el MoE MULTITASK (moe_multitask): mismo gating (pca 100, k 4, cov full,
# min_cluster_size 250) y mismo HP de expert (u1kgstvr), pero cada experto predice UN ambiente
# (optimal) con una red single-task, en vez de tronco compartido + una cabeza por ambiente.
# Pregunta: ¿el sharing multitarea (optimal+drought juntos) aporta sobre modelar drought solo?
# Referencia: MoE multitask drought 2019 = 0.369; GBLUP-drought = 0.241.

experiment:
  name: moe_singletask_GY_2017_2018_to_2019_optimal
  description: >
    MoE single-task (PCA+GMM, expertos = ensemble de MLP single-task) para GY optimal. Train
    2017+2018 -> val 2019. A/B contra el MoE multitask a HP fijo.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2019
  train_years: [2017, 2018]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: moe_singletask
  params:
    gating:
      pca_n_components: 100
      standardize: true
      whiten: true
      k: 4
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 250
      global_fallback: true
      random_state: 575
    expert:
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, singletask, pca, gmm, train2017-2018, val2019, GY, optimal, winHP]
