# Sweep BAYESIANO del MIXTURE OF EXPERTS MULTITASK (GY+PH+AD), optimizando PEARSON DE GY
# DIRECTAMENTE (pearson_r_GY), NO el promedio de traits. Barre el gating (PCA+GMM) y la
# arquitectura/regularizacion de los experts (EnsembleMultitaskRegressor por cluster).
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base, sin tocar 2019). El
# reporte final (reentrenar 2017+2018 -> 2019 vs GBLUP/univariado/MT global) es un paso
# posterior en el notebook con los HP ganadores; 2020 sellado.
#
# COSTO: cada trial entrena (k + 1) * n_models redes (experts por cluster + fallback). Por eso
# n_models y k se mantienen chicos y run_cap es acotado. set_nested soporta las claves anidadas
# profundas (model.params.expert.inner.*).
#
# Uso:
#   wandb login
#   wandb sweep configs/sweep_moe_multitask.yaml     # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en tmux

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_moe_multitask_pearsonGY_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 120

metric:
  name: pearson_r_GY
  goal: maximize

parameters:
  # --- gating: PCA + GMM ---
  model.params.gating.pca_n_components:
    values: [20, 50, 100, 200]
  model.params.gating.k:
    values: [2, 3, 4]
  model.params.gating.covariance_type:
    values: [full, diag, tied]
  model.params.gating.min_cluster_size:
    values: [100, 150, 250]
  # --- experts: ensemble por cluster ---
  model.params.expert.n_models:
    values: [3, 5]
  # --- experts: arquitectura del tronco (mlp_multitask) ---
  model.params.expert.inner.hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [128, 64]
      - [256, 128]
  model.params.expert.inner.activation:
    values: [relu, gelu, leaky_relu]
  model.params.expert.inner.batchnorm:
    values: [true, false]
  # --- experts: regularizacion (clave en p >> n, mas aun con subsets chicos por cluster) ---
  model.params.expert.inner.dropout:
    distribution: uniform
    min: 0.0
    max: 0.7
  model.params.expert.inner.input_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  model.params.expert.inner.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  # --- experts: optimizacion ---
  model.params.expert.inner.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  model.params.expert.inner.batch_size:
    values: [0, 32, 64]           # 0 = full-batch
  model.params.expert.inner.max_epochs:
    distribution: int_uniform
    min: 20
    max: 300
  # --- pesos auxiliares de la loss (GY anclado en 1.0 en el config base) ---
  model.params.expert.inner.loss_weights.PH:
    distribution: uniform
    min: 0.0
    max: 1.0
  model.params.expert.inner.loss_weights.AD:
    distribution: uniform
    min: 0.0
    max: 1.0

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_moe_multitask_2017_to_2018.yaml
