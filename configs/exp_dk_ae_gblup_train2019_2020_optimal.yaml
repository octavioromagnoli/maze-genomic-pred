# DIAGNOSTICO (NO es el cierre): entrena SOLO en 2019 y predice 2020.
# dk_ae_gblup, GY optimal. Testea adyacencia (2019->2020) vs pool (2017-2019->2020). HP default.
experiment:
  name: dk_ae_gblup_train2019_2020_optimal
  description: 'DIAGNOSTICO (no es cierre): dk_ae_gblup entrenado SOLO en 2019 ->
    predecir 2020, GY optimal. Testea si el ano adyacente predice mejor que poolear
    2017-2019. HP default.'
seed: 575
data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal
cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years:
  - 2019
  holdout_test_year: null
  enforce_disjoint_lines: true
preprocess:
  autoencoder:
    latent_dim: 128
    encoder_hidden:
    - 1024
    - 256
    activation: relu
    dropout: 0.0
    batchnorm: false
    tie_weights: false
    denoising_p: 0.1
    lr: 0.001
    weight_decay: 0.0
    batch_size: 128
    max_epochs: 300
    patience: 30
    val_frac: 0.1
    seed: 575
    device: null
model:
  name: gblup
  params:
    lambda_method: reml
bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05
artifacts:
  save_model: false
wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags:
  - deep-kernel
  - autoencoder
  - gblup
  - two-stage
  - confirm
  - train20172018
  - val2019
  - GY
  - optimal
  - final2020
  - holdout
  - train2019
  - diag2020
