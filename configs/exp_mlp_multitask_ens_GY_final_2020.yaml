# MLP MULTITASK (PyTorch) — CONFIG BASE del sweep. Un tronco compartido predice
# GY + PH + AD a la vez (cabeza Linear(prev, 3)). SELECCIÓN HONESTA de HP:
# train 2017 -> val 2018 (clavado acá). Se elige sobre 2018 sin tocar 2019, así no hay
# winner's curse sobre el set de reporte. El reporte final (reentrenar 2017+2018 -> 2019,
# comparado contra GBLUP por trait y contra el MLP univariado) se hace en el notebook con
# los HP ganadores; 2020 queda sellado.
#
# Lo barre configs/sweep_mlp_multitask.yaml (HP en model.params.*). NO tocar cv.* ni data.*
# (reglas 2 y 3): el split vive acá.
#
# LOSS = PEARSON ENMASCARADA Y PONDERADA: L = sum_i w_i * (1 - r_i) por trait, usando solo
# las filas con dato real (Y_mask). Más peso a GY (portada). El r es invariante a afines, así
# que la escala de cada cabeza no queda calibrada -> RMSE/R² de apoyo; el Pearson manda.
#
# El sweep optimiza Pearson de GY DIRECTAMENTE (pearson_r_GY), no el promedio de traits.
#
# Con UN solo año de train (2017) NO hay inner-split temporal -> NO hay early stopping:
# la red entrena `max_epochs` fijo y `max_epochs` pasa a ser un HP del sweep. patience: null.

experiment:
  name: mlp_multitask_final_2020
  description: >
    MLP multitask (PyTorch) para GY+PH+AD en ambiente optimo, entrenado con 2017 y validado
    en 2018 para la SELECCION de hiperparametros (inner honesto, sin tocar 2019). Tronco
    compartido sobre los marcadores crudos (estandarizados train-only dentro del modelo) y
    cabeza lineal de 3 salidas. Perdida = Pearson enmascarada y ponderada (mas peso a GY). El
    sweep optimiza Pearson de GY. Sin early stopping (un solo ano de train): max_epochs es un
    HP del sweep. 2019 queda para el reporte (reentrenando 2017+2018 en el notebook) y 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  targets: [GY, PH, AD]     # multitask: lista de traits (orden = columnas de Y)
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2020            # inner-val de seleccion (honesto)
  train_years: [2018,2019]       
  holdout_test_year: null   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

# OJO: este modelo hace su estandarizacion train-only DENTRO de fit (regla 1; z-score de
# inputs por SNP y del target por columna, ignorando enmascarados) y overridea save/load
# (state_dict + arquitectura + buffers mu/sigma). No se usa el bloque `preprocess:`.

model:
  name: ensemble_multitask
  params:
    n_models: 20              # ensemble grande para el modelo final (mas estable que en el sweep)
    seed_step: 1000
    inner:
      # --- arquitectura / regularizacion (valores base; el sweep los pisa) ---
      hidden_dims: [128]
      dropout: 0.3872110609392305
      input_dropout: 0.4652712923249515
      activation: elu
      batchnorm: false
      # --- optimizacion ---
      lr: 0.002286545179484641
      weight_decay: 0.008188780689690783
      batch_size: 128              # el sweep barre batch_size (incluye full-batch = 0)
      max_epochs: 70             # HP del sweep (no hay early stopping con 1 ano de train)
      # --- perdida = Pearson enmascarada + ponderada ---
      loss: pearson               # "pearson" | "pearson_mse"
      loss_weights:               # L = sum_i w_i * (1 - r_i); mas peso a GY (portada)
        GY: 1.0
        PH: 0.3774232060946394
        AD: 0.6088563932645153
      patience: null              # sin early stopping: con un solo ano no hay inner-split
      standardize_inputs: true
      standardize_target: true    # z-score por columna, enmascarado (mu/sigma como buffers)
      random_state: 575           # seed del RNG de torch (init de pesos); NO se barre
      device: auto                # usa GPU si hay (acelera el sweep), cae a cpu

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false             # el sweep no guarda modelos; el final se reentrena aparte

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [mlp, multitask, nn, pytorch, sweep, select, train2017, val2018, GY, PH, AD, optimal, pearson-loss]
