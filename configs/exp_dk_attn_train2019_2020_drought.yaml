# DIAGNOSTICO (NO es el cierre): entrena SOLO en 2019 y predice 2020.
# dk_attn, GY drought. Testea adyacencia (2019->2020) vs pool (2017-2019->2020). HP default.
experiment:
  name: dk_attn_train2019_2020_drought
  description: 'DIAGNOSTICO (no es cierre): dk_attn entrenado SOLO en 2019 -> predecir
    2020, GY drought. Testea si el ano adyacente predice mejor que poolear 2017-2019.
    HP default.'
seed: 575
data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: drought
cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years:
  - 2019
  holdout_test_year: null
  enforce_disjoint_lines: true
model:
  name: deep_kernel_attn
  params:
    embed_dim: 64
    hidden_dims:
    - 512
    dropout: 0.3
    input_dropout: 0.3
    activation: relu
    batchnorm: false
    cosine: true
    tau: 0.1
    lr: 0.001
    weight_decay: 0.0001
    max_epochs: 300
    standardize_inputs: true
    standardize_target: true
    random_state: 575
    device: auto
bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05
artifacts:
  save_model: false
wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags:
  - deep-kernel
  - attention
  - relational
  - confirm
  - train20172018
  - val2019
  - GY
  - drought
  - final2020
  - holdout
  - train2019
  - diag2020
