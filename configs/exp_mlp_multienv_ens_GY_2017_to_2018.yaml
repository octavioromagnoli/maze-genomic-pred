# ENSEMBLE de seeds del MLP MULTITASK MULTI-AMBIENTE (GY) — CONFIG BASE del sweep ROBUSTO.
#
# POR QUE: el Pearson de UNA seed en val 2018 es ruidoso -> un sweep que selecciona por ese numero
# OVERFITTEA 2018 y NO generaliza (winner's curse; verificado: el mejor single-seed falla la regla
# de oro). Aca cada trial entrena un ENSEMBLE de `n_models` seeds y promedia: el `pearson_r_GY` que
# optimiza el sweep es el DEL ENSEMBLE (estable), y el modelo final desplegado ES ese ensemble. Asi
# la ventaja que elige el sweep se sostiene a seeds y entre anios.
#
# El modelo `ensemble_multitask` envuelve `mlp_multitask`: entrena n_models redes con seeds
# inner.random_state + i*seed_step y promedia las predicciones estandarizadas por columna (la loss
# pearson deja la escala arbitraria). Los HP de la RED van en model.params.inner.* (es lo que barre
# el sweep). Mismo pipeline multitask multienv (data.multienv, cabezas por ambiente).
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado aca), sin tocar 2019. El reporte (reentrenar
# 2017+2018 -> 2019) y el TEST FINAL (reentrenar 2017+2018+2019 -> 2020) se hacen despues con los HP
# ganadores; 2020 sellado. Lo barre configs/sweep_mlp_multienv_ens.yaml. NO tocar cv.*/data.*.

experiment:
  name: mlp_multienv_ens_GY_2017_to_2018
  description: >
    Ensemble de seeds (n_models) del MLP multitask multi-ambiente para GY (cabezas optimal +
    drought). Cada trial del sweep evalua el ensemble (no una seed) -> seleccion de HP robusta al
    winner's curse. Train 2017 -> val 2018 para la SELECCION. Portada = drought. 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true            # un trait, varios ambientes como cabezas
  target: GY
  envs: [optimal, drought]
  cover_env: drought        # portada: pearson_r_GY del sweep = pearson de la cabeza drought DEL ENSEMBLE

cv:
  scheme: fixed_temporal
  val_year: 2018
  train_years: [2017]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: ensemble_multitask
  params:
    n_models: 5               # seeds por trial (5 = buen balance robustez/costo; 3 si el sweep es caro)
    seed_step: 1000           # seeds = inner.random_state + i*seed_step
    inner:                    # HP de la RED (mlp_multitask); ESTO es lo que barre el sweep
      hidden_dims: [128]
      dropout: 0.5
      input_dropout: 0.3
      activation: relu
      batchnorm: false
      lr: 0.0005
      weight_decay: 0.001
      batch_size: 64
      max_epochs: 100
      loss: pearson
      loss_weights:
        GY_optimal: 1.0
        GY_drought: 1.0
      patience: null
      standardize_inputs: true
      standardize_target: true
      random_state: 575       # seed BASE del ensemble (las demas: +1000, +2000, ...)
      device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [mlp, multitask, multienv, ensemble, nn, pytorch, sweep, select, train2017, val2018, GY, drought, pearson-loss]
