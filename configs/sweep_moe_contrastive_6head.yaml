# Sweep BAYESIANO del MoE HARD de 6 CABEZAS con gating CONTRASTIVO (proyector lineal + triplet loss
# sobre G), optimizando pearson_r_GY (= GY_DROUGHT, cover_env: drought en el config base). Con HP
# heredado (u1kgstvr) el contrastivo dio 0.295 en sequia; nunca se sweepeo. Este barrido optimiza
# (a) el proyector contrastivo (latent_dim, margin, negativos, lr, epochs) y el GMM, (b) la
# arquitectura/regularizacion del experto, para ver si otra via de gating se acerca al PCA (0.407).
#
# SESGO a buena regularizacion (expertos por cluster hambrientos de datos en p>>n), igual que el
# sweep del hard: dropout/input_dropout/wd con piso alto, redes acotadas, min_cluster_size grande.
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base, sin tocar 2019).
#
# Uso:
#   wandb sweep configs/sweep_moe_contrastive_6head.yaml      # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en screen

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_moe_contrastive_6head_pearsonGYdrought_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 80

metric:
  name: pearson_r_GY
  goal: maximize

parameters:
  # --- gating: proyector contrastivo (triplet sobre G) + GMM ---
  model.params.gating.contrastive.latent_dim:
    values: [10, 20, 40]
  model.params.gating.contrastive.margin:
    values: [0.5, 1.0, 2.0]
  model.params.gating.contrastive.n_neg:
    values: [10, 20, 40]
  model.params.gating.contrastive.lr:
    distribution: log_uniform_values
    min: 0.001
    max: 0.03
  model.params.gating.contrastive.epochs:
    values: [100, 150, 200]
  model.params.gating.k:
    values: [2, 3, 4]
  model.params.gating.covariance_type:
    values: [full, diag, tied]
  model.params.gating.min_cluster_size:
    values: [150, 250, 400]
  # --- experts: arquitectura acotada ---
  model.params.expert.inner.hidden_dims:
    values:
      - [64]
      - [128]
      - [128, 64]
  model.params.expert.inner.activation:
    values: [relu, gelu, leaky_relu]
  model.params.expert.inner.batchnorm:
    values: [true, false]
  # --- experts: regularizacion SESGADA ALTA ---
  model.params.expert.inner.dropout:
    distribution: uniform
    min: 0.2
    max: 0.7
  model.params.expert.inner.input_dropout:
    distribution: uniform
    min: 0.1
    max: 0.5
  model.params.expert.inner.weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  # --- experts: optimizacion ---
  model.params.expert.inner.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.003
  model.params.expert.inner.batch_size:
    values: [32, 64]
  model.params.expert.inner.max_epochs:
    distribution: int_uniform
    min: 40
    max: 200

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_moe_contrastive_6head_2017_to_2018.yaml
