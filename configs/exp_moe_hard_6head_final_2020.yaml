# MoE HARD (PCA+GMM, hard top-1) con expertos MULTITASK de 6 CABEZAS: 3 traits (GY, PH, AD) x 2
# ambientes (optimal, drought). Cada experto por cluster es un ensemble multitask con tronco
# compartido + 6 cabezas. HP ganador u1kgstvr, train 2017+2018 -> val 2019. Portada = GY_drought.
#
# Combina las dos palancas: gating por subpoblacion (la que gana) + 6 cabezas (que diluyeron en el
# multitask plano). Referencias GY_drought 2019:
#   - MoE hard 2-cabezas GY:            0.369
#   - Multitask 6-cabezas (sin gating): 0.275
#   - Multitask 2-cabezas GY (sin gat): 0.312
#   - GBLUP-drought:                    0.241

experiment:
  name: moe_hard_6head_final_2020
  description: >
    MoE hard (PCA+GMM) con expertos multitask de 6 cabezas (GY/PH/AD x optimal/drought). HP ganador
    u1kgstvr. Train 2017+2018 -> val 2019. Portada = GY_drought. Gating + 6 cabezas.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multi_trait_env: true       # 3 traits x 2 ambientes = 6 cabezas (una fila por GID x Year)
  targets: [GY, PH, AD]
  envs: [optimal, drought]
  cover_env: drought          # portada = GY_drought

cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years: [2017, 2018, 2019]
  holdout_test_year: null
  enforce_disjoint_lines: true

model:
  name: moe_multitask
  params:
    gating:
      pca_n_components: 100
      standardize: true
      whiten: true
      k: 4
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 250
      global_fallback: true
      random_state: 575
    expert:
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        loss_weights:            # una entrada por cabeza (6); pesos iguales
          GY_optimal: 1.0
          GY_drought: 1.0
          PH_optimal: 1.0
          PH_drought: 1.0
          AD_optimal: 1.0
          AD_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, hard, multitask, 6head, 3traits, 2env, pca, gmm, train2017-2018, val2020, GY, PH, AD, optimal, drought, winHP]
