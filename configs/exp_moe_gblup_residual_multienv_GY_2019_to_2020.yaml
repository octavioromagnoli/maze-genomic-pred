# MoE HARD con GBLUP backbone (PCA+GMM hard top-1 + expertos sobre el residuo y-û) — cross-cycle
# train2019 -> val2020. Para el reporte consolidado; mcs 150, HP ganador u1kgstvr (consistente con
# las otras variantes en este fold). 2020 aca es evaluacion cross-cycle, NO el cierre final.

experiment:
  name: moe_gblup_residual_multienv_GY_2019_to_2020
  description: MoE hard PCA+GMM con GBLUP backbone + residuo, train2019->val2020, para el reporte consolidado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true
  target: GY
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years: [2019]
  holdout_test_year: null
  enforce_disjoint_lines: true

model:
  name: moe_gblup_residual_multitask
  params:
    gating:
      gblup:
        lambda_method: reml
      pca_n_components: 100
      standardize: true
      whiten: true
      k: 4
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 150
      global_fallback: true
      random_state: 575
    expert:
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, hard, gblup-backbone, residual, multienv, multitask, cross-cycle, train2019, val2020, GY, optimal, drought]
