# Sweep BAYESIANO ROBUSTO de XGBoost en SEQUIA: cada trial evalua un ENSEMBLE de n_models seeds
# (model.name=ensemble, inner_name=xgboost) y optimiza el pearson_r_mean DEL ENSEMBLE en val 2018.
# Evita el winner's curse del sweep single-seed (el Pearson de una seed de XGB es ruido por el
# subsample/colsample). Los HP del XGB se barren en model.params.inner.* (n_models/seed_step quedan
# fijos en el config base). El modelo final desplegado ES el ensemble.
#
# Uso:
#   wandb sweep configs/sweep_xgb_ens_drought.yaml         # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en tmux

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_xgb_ens_drought_pearson_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 60

metric:
  name: pearson_r_mean        # ahora es el Pearson del ENSEMBLE de XGB en val 2018 (estable)
  goal: maximize

parameters:
  model.params.inner.n_estimators:
    distribution: int_uniform
    min: 50
    max: 1200
  model.params.inner.max_depth:
    values: [2, 3, 4, 5, 6]
  model.params.inner.learning_rate:
    distribution: log_uniform_values
    min: 0.005
    max: 0.3
  model.params.inner.subsample:
    distribution: uniform
    min: 0.5
    max: 1.0
  model.params.inner.colsample_bytree:
    distribution: uniform
    min: 0.3
    max: 1.0
  model.params.inner.reg_lambda:
    distribution: log_uniform_values
    min: 0.001
    max: 10.0
  model.params.inner.reg_alpha:
    values: [0.0, 0.001, 0.01, 0.1, 1.0]
  model.params.inner.min_child_weight:
    values: [1, 3, 5, 10]
  model.params.inner.gamma:
    values: [0.0, 0.1, 0.5, 1.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_xgb_ens_drought_2017_to_2018.yaml
