# Experimento Fase 0: smoke test end-to-end con predictor por la media.
# Los hiperparámetros se cambian ACÁ, nunca editando código.

experiment:
  name: dummy_mean_predictor
  description: >
    Corrida dummy para validar el harness completo (datos -> CV temporal
    agrupada por línea -> métricas -> wandb) antes de escribir modelos reales.

seed: 575  # numpy/torch/random; se loguea entero a wandb

data:
  geno_csv: data/Geno_data.csv     # GID + columnas SNP binarias
  pheno_csv: data/Pheno_data.csv   # wide: GID, Year, <TRAIT>_<Optimal|Drought>
  target: GY        # portada: Grain Yield. Alternativas: PH, AD
  env: optimal      # 'optimal' / 'drought'; null = apila ambos ambientes

cv:
  scheme: fixed_temporal     # UN split fijo train/val
  val_year: 2019             # año de validación; train = años de dev anteriores (2017-2018)
  holdout_test_year: 2020    # test final intocable, excluido del dev
  enforce_disjoint_lines: true   # val solo con líneas no vistas en train (escenario CV1)

model:
  name: mean_predictor   # clave del registry (src/models/registry.py)
  params: {}

preprocess:              # preprocesamiento train-only de SNPs (común a todos los modelos)
  maf_threshold: 0.05    # filtro de MAF, decisión (b) del EDA; recalculado con el train de cada fold
  standardize: false     # SNPs {0,1}: los lineales (Ridge/GBLUP) lo activan; el AE NO (usa {0,1} crudo)

bootstrap:
  enabled: true     # IC por bootstrap (cluster a nivel línea) sobre validación
  n_boot: 1000
  alpha: 0.05       # IC del 95% (percentiles 2.5 / 97.5)

artifacts:
  save_model: true             # guarda el modelo del fold de validación (copia local + wandb Artifact)
  name: dummy-mean-gy-optimal  # nombre del artifact
  aliases: [latest]

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline  # no requiere login; sincronizar luego con `wandb sync`
  tags: [phase0, dummy, smoke]
