# =====================================================================
# !!!  TEST FINAL EN 2020 — CIERRE, UNA SOLA MIRADA AL HOLDOUT  !!!
# dk_attn entrena en TODO el dev (2017+2018+2019) y predice 2020 (drought).
# HP default (no barridos): honesto (los HP no vieron 2020) pero sin tunear.
# Generado desde el confirm-2019 homonimo; solo cambia el split.
# =====================================================================
experiment:
  name: dk_attn_final_2020_drought
  description: 'TEST FINAL (cierre): dk_attn reentrenado en TODO el dev (2017+2018+2019)
    y evaluado en 2020, GY drought. HP default (no barridos). Una sola mirada al holdout.'
seed: 575
data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: drought
cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years:
  - 2017
  - 2018
  - 2019
  holdout_test_year: null
  enforce_disjoint_lines: true
model:
  name: deep_kernel_attn
  params:
    embed_dim: 64
    hidden_dims:
    - 512
    dropout: 0.3
    input_dropout: 0.3
    activation: relu
    batchnorm: false
    cosine: true
    tau: 0.1
    lr: 0.001
    weight_decay: 0.0001
    max_epochs: 300
    standardize_inputs: true
    standardize_target: true
    random_state: 575
    device: auto
bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05
artifacts:
  save_model: false
wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags:
  - deep-kernel
  - attention
  - relational
  - confirm
  - train20172018
  - val2019
  - GY
  - drought
  - final2020
  - holdout
