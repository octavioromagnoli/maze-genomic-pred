# CONFIG BASE del sweep del MoE hard con GBLUP backbone (residuo) — SELECCION honesta 2017 -> 2018.
#
# Modelo moe_gblup_residual_multitask: ruteo PCA+GMM hard top-1 (idéntico al hard ganador) + un
# GBLUP por ambiente como backbone; cada experto predice el residuo y-û y la prediccion final es
# û + experto. Este config fija el fold de SELECCION (train 2017 -> val 2018, sin tocar 2019, regla 3)
# y los valores por defecto; el sweep (configs/sweep_moe_gblup_residual_multienv.yaml) pisa
# model.params.* y optimiza pearson_r_GY (= cabeza drought, cover_env). El reporte final (reentrenar
# 2017+2018 -> 2019 con el HP ganador, config exp_moe_gblup_residual_multienv_GY_2017_2018_to_2019)
# es un paso posterior; 2020 sellado.
#
# Referencias en el fold 2019 (mismo HP ganador del hard): hard crudo 0.369, esta variante 0.323,
# GBLUP-drought 0.241, ruteo-en-û soft (descartado) 0.189.

experiment:
  name: moe_gblup_residual_multienv_GY_2017_to_2018
  description: >
    MoE hard (PCA+GMM) con GBLUP backbone y expertos sobre el residuo. Config base del sweep:
    seleccion honesta train 2017 -> val 2018, portada = drought. 2019 reporte, 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true
  target: GY
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2018
  train_years: [2017]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: moe_gblup_residual_multitask
  params:
    gating:
      gblup:
        lambda_method: reml     # backbone GBLUP (una eigen-descomp por ambiente); NO se barre
      pca_n_components: 100
      standardize: true
      whiten: true
      k: 4
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 250
      global_fallback: true
      random_state: 575
    expert:
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [moe, hard, gblup-backbone, residual, pca, gmm, multienv, multitask, sweep, select, train2017, val2018, GY, optimal, drought]
