# =====================================================================
# !!!  TEST FINAL EN 2020 — CIERRE, UNA SOLA MIRADA AL HOLDOUT  !!!
# dk_ae_gblup entrena en TODO el dev (2017+2018+2019) y predice 2020 (optimal).
# HP default (no barridos): honesto (los HP no vieron 2020) pero sin tunear.
# Generado desde el confirm-2019 homonimo; solo cambia el split.
# =====================================================================
experiment:
  name: dk_ae_gblup_final_2020_optimal
  description: 'TEST FINAL (cierre): dk_ae_gblup reentrenado en TODO el dev (2017+2018+2019)
    y evaluado en 2020, GY optimal. HP default (no barridos). Una sola mirada al holdout.'
seed: 575
data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal
cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years:
  - 2017
  - 2018
  - 2019
  holdout_test_year: null
  enforce_disjoint_lines: true
preprocess:
  autoencoder:
    latent_dim: 128
    encoder_hidden:
    - 1024
    - 256
    activation: relu
    dropout: 0.0
    batchnorm: false
    tie_weights: false
    denoising_p: 0.1
    lr: 0.001
    weight_decay: 0.0
    batch_size: 128
    max_epochs: 300
    patience: 30
    val_frac: 0.1
    seed: 575
    device: null
model:
  name: gblup
  params:
    lambda_method: reml
bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05
artifacts:
  save_model: false
wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags:
  - deep-kernel
  - autoencoder
  - gblup
  - two-stage
  - confirm
  - train20172018
  - val2019
  - GY
  - optimal
  - final2020
  - holdout
