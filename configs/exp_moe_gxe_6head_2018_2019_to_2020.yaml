# MoE GxE (gating por ambiente + ruteo dual), 6 cabezas — ENTREGA: train 2018+2019 -> val 2020.
# Mismos HP que exp_moe_gxe_6head_2017_2018_to_2019.yaml (HP ganador u1kgstvr, env_weight 5),
# retargeteado a 2020 para generar las predicciones de GY (optimal + drought) sobre las 486 líneas.

experiment:
  name: moe_gxe_6head_2018_2019_to_2020
  description: >
    MoE de 6 cabezas con gating guiado por ambiente (PCA || ambiente) + ruteo dual. HP ganador
    u1kgstvr, env_weight 5. Train 2018+2019 -> val 2020. Entrega de predicciones.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multi_trait_env: true
  targets: [GY, PH, AD]
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years: [2018, 2019]
  holdout_test_year: null
  enforce_disjoint_lines: true

model:
  name: moe_gxe_multitask
  params:
    gating:
      pca_n_components: 100
      standardize: true
      whiten: true
      k: 4
      covariance_type: full
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 250
      global_fallback: true
      random_state: 575
      env_weight: 5.0
    expert:
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
          PH_optimal: 1.0
          PH_drought: 1.0
          AD_optimal: 1.0
          AD_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, gxe, env-gating, dual-routing, 6head, 3traits, 2env, pca, gmm, train20182019, val2020, GY, PH, AD, optimal, drought, winHP]
