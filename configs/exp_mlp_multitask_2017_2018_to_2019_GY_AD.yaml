# MLP MULTITASK — ABLATION GY + AD (sin PH): train 2017+2018 -> predecir 2019.
# Mide cuanto aporta SOLO AD como tarea auxiliar a GY. Mismo split/HP que el arm completo;
# cambia data.targets (cabeza Linear(prev, 2) y loss_weights). 2020 sellado.

experiment:
  name: mlp_multitask_2017_2018_to_2019_GY_AD
  description: >
    MLP multitask GY+AD (ambiente optimo) entrenado con 2017+2018 y evaluado en 2019. Arm del
    ablation: GY con AD (dias a floracion) como unica tarea auxiliar. 2020 holdout intocable.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  targets: [GY, AD]
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2019
  train_years: [2017, 2018]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: mlp_multitask
  params:
    hidden_dims: [128]
    dropout: 0.5
    input_dropout: 0.3
    activation: relu
    batchnorm: false
    lr: 0.0005
    weight_decay: 0.001
    batch_size: 64
    max_epochs: 100
    loss: pearson
    loss_weights:
      GY: 1.0
      AD: 0.5
    patience: null
    standardize_inputs: true
    standardize_target: true
    random_state: 575
    device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: true
  name: mlp-multitask-2017-2018-to-2019-GY-AD
  aliases: [latest]

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [mlp, multitask, nn, pytorch, dev, train2017-2018, val2019, GY, AD, optimal, ablation]
