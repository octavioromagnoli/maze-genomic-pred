# REPORTE del HP GANADOR del sweep xkiq8zex (mejor trial xxlc9sc8, pearson_r_GY val2018 = 0.2303)
# para moe_gblup_residual_multitask (MoE hard PCA+GMM con GBLUP backbone + residuo). Reentrenado
# sobre 2017+2018 y evaluado en val 2019 (fold informativo). Comparar contra:
#   - hard+residuo con HP heredado del hard crudo (u1kgstvr): drought 2019 = 0.323
#   - MoE hard crudo:                                          drought 2019 = 0.369
#   - GBLUP-drought:                                           drought 2019 = 0.241

experiment:
  name: moe_gblup_residual_multienv_GY_2017_2018_to_2019_bestsweep
  description: >
    MoE hard PCA+GMM con GBLUP backbone + residuo, HP ganador del sweep xkiq8zex/xxlc9sc8.
    Train 2017+2018 -> val 2019.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true
  target: GY
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2019
  train_years: [2017, 2018]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: moe_gblup_residual_multitask
  params:
    gating:
      gblup:
        lambda_method: reml
      pca_n_components: 100      # ganador del sweep
      standardize: true
      whiten: true
      k: 4                      # ganador
      covariance_type: tied     # ganador (el sweep prefirio 'tied' sobre 'full')
      reg_covar: 1.0e-6
      n_init: 1
      min_cluster_size: 250     # ganador
      global_fallback: true
      random_state: 575
    expert:
      n_models: 5               # ganador
      seed_step: 1000
      inner:
        hidden_dims: [128, 64]  # ganador (2 capas)
        dropout: 0.2943675483734754
        input_dropout: 0.2578563183358415
        activation: gelu        # ganador
        batchnorm: true         # ganador
        lr: 0.000229276919260738
        weight_decay: 7.95537582345579e-05
        batch_size: 32
        max_epochs: 211
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, hard, gblup-backbone, residual, pca, gmm, multienv, multitask, train2017-2018, val2019, GY, optimal, drought, bestsweep]
