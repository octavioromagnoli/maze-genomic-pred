# Sweep BAYESIANO de los hiperparámetros del MLP (red neuronal), con la red
# optimizando PEARSON (loss = 1 - r, clavada en el config base).
#
# SELECCIÓN HONESTA: train 2017 -> val 2018 (clavado en el config base). Se elige el
# mejor HP sobre 2018 sin tocar 2019 -> sin winner's curse sobre el set de reporte. El
# reporte final (reentrenar 2017+2018 -> val 2019, comparado con GBLUP) es un paso
# posterior en el notebook con los HP ganadores; 2020 sellado.
#
# Métrica: pearson_r_mean (Pearson de val 2018, regla 5), MAXIMIZAR. Con el split fijo
# hay un único fold de scoring, así que pearson_r_mean == Pearson de 2018. train.py la
# deja en run.summary, que es lo que lee el controller. NO poner cv.* ni data.* acá
# (reglas 2 y 3): el split vive en el config base.
#
# max_epochs SÍ se barre: con un solo año de train (2017) no hay inner-split temporal,
# así que la red no puede early-stoppear -> el número de épocas es un HP (como
# n_estimators en XGBoost). batch_size incluye 0 = full-batch: con la pérdida Pearson,
# full-batch estima el r sobre TODO el train (gradiente menos ruidoso que por batch).
#
# Sin early_terminate (hyperband): el MLP no loguea métricas por época (run.py solo
# loguea a nivel fold), así que no hay señal intermedia para podar trials.
#
# Uso:
#   wandb login                                   # una vez (controller online)
#   wandb sweep configs/sweep_mlp.yaml            # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en tmux
#
# Costo: cada trial entrena UNA red sobre 2017 por `max_epochs`. Con device: auto usa
# GPU si hay. Bajá run_cap para un primer pase exploratorio.

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_mlp_pearson_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 200

metric:
  name: pearson_r_mean
  goal: maximize

parameters:
  # --- arquitectura ---
  model.params.hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [512]
      - [128, 64]
      - [256, 128]
      - [512, 256]
      - [256, 128, 64]
      - [2048, 1024, 512, 256]
  model.params.activation:
    values: [relu, gelu, leaky_relu, elu, tanh]
  model.params.batchnorm:
    values: [true, false]
  # --- regularización (clave en p >> n) ---
  model.params.dropout:
    distribution: uniform
    min: 0.0
    max: 0.7
  model.params.input_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  model.params.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  # --- optimización ---
  model.params.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  model.params.batch_size:
    values: [0, 32, 64, 128]      # 0 = full-batch (r sobre todo el train)
  model.params.max_epochs:
    distribution: int_uniform
    min: 20
    max: 400

# --config fijo (sin ${args}): argparse de train.py solo ve --config y los HP
# barridos llegan por wandb.config (merge dot-notation en train.py).
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_mlp_2017_to_2018.yaml
