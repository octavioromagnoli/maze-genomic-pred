# Sweep BAYESIANO del MoE PARTITION-ENSEMBLE de 6 CABEZAS
# (moe_partition_ensemble_multitask + multi_trait_env: GY/PH/AD x optimal/drought), optimizando
# pearson_r_GY (= GY_drought, cover_env). Es el sweep de la variante ROBUSTA: promedia K=5 particiones
# GMM independientes para matar la varianza del ruteo (blindaje 2026-07-06).
#
# n_partitions se deja FIJO en 5 (es el mecanismo bajo prueba, viene del config base); expert.n_models
# tambien fijo en 3 (acotar costo: cada trial = 5 particiones x ~5 expertos x 3 redes ~= 75 redes).
# Se barren gating (PCA/GMM) y arquitectura/regularizacion del experto, con el MISMO sesgo pro-regularizacion
# que el sweep del MoE hard (dropout/wd altos, redes acotadas, clusters grandes).
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base). 2019 reporte, 2020 sellado.
#
# Uso:
#   wandb sweep configs/sweep_moe_partens_6head.yaml    # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en screen

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_moe_partens_6head_pearsonGY_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 50

metric:
  name: pearson_r_GY
  goal: maximize

parameters:
  # --- gating: PCA + GMM (min_cluster_size sesgado hacia clusters grandes) ---
  model.params.gating.pca_n_components:
    values: [50, 100, 200]
  model.params.gating.k:
    values: [2, 3, 4]
  model.params.gating.covariance_type:
    values: [full, diag, tied]
  model.params.gating.min_cluster_size:
    values: [150, 250, 400]
  # --- experts: arquitectura acotada (evitar redes que sobreajusten al cluster chico) ---
  model.params.expert.inner.hidden_dims:
    values:
      - [64]
      - [128]
      - [128, 64]
  model.params.expert.inner.activation:
    values: [relu, gelu, leaky_relu]
  model.params.expert.inner.batchnorm:
    values: [true, false]
  # --- experts: regularizacion SESGADA ALTA ---
  model.params.expert.inner.dropout:
    distribution: uniform
    min: 0.2
    max: 0.7
  model.params.expert.inner.input_dropout:
    distribution: uniform
    min: 0.1
    max: 0.5
  model.params.expert.inner.weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  # --- experts: optimizacion (epochs acotados para no sobreajustar) ---
  model.params.expert.inner.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.003
  model.params.expert.inner.batch_size:
    values: [32, 64]
  model.params.expert.inner.max_epochs:
    distribution: int_uniform
    min: 40
    max: 200

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_moe_partens_6head_2017_to_2018.yaml
