# Sweep BAYESIANO del MIXTURE OF EXPERTS MULTITASK MULTI-AMBIENTE (GY optimal+drought),
# optimizando pearson_r_GY (= cabeza drought, cover_env del config base). Barre el gating
# (PCA+GMM) y la arquitectura/regularizacion de los experts multi-ambiente por cluster.
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base, sin tocar 2019). El
# reporte final (reentrenar 2017+2018 -> 2019 vs GBLUP-drought y el multienv GLOBAL) es un paso
# posterior en el notebook; 2020 sellado. Loss_weights por cabeza (GY_optimal/GY_drought)
# quedan en 1.0 (config base): 2x al target no ayudo en el multienv global.
#
# COSTO: cada trial entrena (k + 1) * n_models redes. n_models/k chicos, run_cap acotado.
#
# Uso:
#   wandb sweep configs/sweep_moe_multienv.yaml      # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en tmux

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_moe_multienv_pearsonGY_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 120

metric:
  name: pearson_r_GY
  goal: maximize

parameters:
  # --- gating: PCA + GMM ---
  model.params.gating.pca_n_components:
    values: [20, 50, 100, 200]
  model.params.gating.k:
    values: [2, 3, 4]
  model.params.gating.covariance_type:
    values: [full, diag, tied]
  model.params.gating.min_cluster_size:
    values: [100, 150, 250]
  # --- experts: ensemble por cluster ---
  model.params.expert.n_models:
    values: [3, 5]
  # --- experts: arquitectura (tronco NO-LINEAL; la variante lineal no supera a GBLUP) ---
  model.params.expert.inner.hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [128, 64]
      - [256, 128]
  model.params.expert.inner.activation:
    values: [relu, gelu, leaky_relu]
  model.params.expert.inner.batchnorm:
    values: [true, false]
  # --- experts: regularizacion ---
  model.params.expert.inner.dropout:
    distribution: uniform
    min: 0.0
    max: 0.7
  model.params.expert.inner.input_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  model.params.expert.inner.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  # --- experts: optimizacion ---
  model.params.expert.inner.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  model.params.expert.inner.batch_size:
    values: [0, 32, 64]
  model.params.expert.inner.max_epochs:
    distribution: int_uniform
    min: 20
    max: 300

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_moe_multienv_GY_2017_to_2018.yaml
