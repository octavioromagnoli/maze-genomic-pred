# XGBoost — train 2017+2018 -> predecir 2019 sobre GY (dev, NO toca el holdout 2020).
# Variante con 2000 arboles FIJOS: sin early stopping (no hay inner-val temporal),
# se entrena el numero completo de arboles sobre todo el train del fold.

experiment:
  name: xgboost_2017_2018_to_2019_2000fixed
  description: >
    XGBoost (gradient boosting) entrenado con 2017+2018 y evaluado sobre 2019
    para el target GY en ambiente optimo. 2000 arboles FIJOS, sin early stopping.
    2020 queda como holdout intocable.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2019            # anio a predecir
  train_years: [2017, 2018] # train explicito
  holdout_test_year: 2020   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

# Preprocesamiento train-only (regla 1): filtra SNPs de baja MAF en el train del fold.
preprocess:
  maf_threshold: 0.05
  standardize: false        # los arboles no requieren escala

model:
  name: xgboost
  params:
    n_estimators: 2000        # arboles FIJOS
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.5
    reg_lambda: 1.0
    # sin early_stopping_rounds -> no hay seleccion, se usan los 2000 arboles
    random_state: 575

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: true
  name: xgboost-2017-2018-to-2019-2000fixed
  aliases: [latest]

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [xgboost, dev, train2017-2018, val2019, GY, optimal, 2000fixed]
