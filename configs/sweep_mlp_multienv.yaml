# Sweep BAYESIANO del MLP MULTITASK MULTI-AMBIENTE (GY: cabezas optimal + drought),
# optimizando PEARSON DE LA PORTADA (drought) DIRECTAMENTE (pearson_r_GY == Pearson de la
# cabeza cover_env=drought en val 2018). La red minimiza la Pearson loss enmascarada y
# ponderada (loss: pearson, clavada en el config base).
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base). El reporte final
# (reentrenar 2017+2018 -> 2019 vs GBLUP-drought) es un paso posterior en el notebook; 2020
# sellado. NO poner cv.* ni data.* aca (reglas 2 y 3): viven en el base.
#
# !!! WINNER'S CURSE (importante) !!! `pearson_r_GY` es de UNA seed en val2018 -> ruidoso. El
# "mejor del sweep" OVERFITTEA 2018 y NO generaliza bien a 2019 (entre HP, 2018 predice debil a
# 2019; verificado: el top-1 single-seed da Δ2018 ns y solo +0.05 en 2019, mientras los HP BASE
# regularizados + ensemble de 20 seeds dan +0.016* en 2018 y +0.079* en 2019, seed-estables).
# => NO uses el mejor single-seed. Recipe robusto: HP base (config base) + ensemble multi-seed.
# Si querés usar el sweep, RE-RANKEA el top-K por su ENSEMBLE de K seeds en val2018 (criterio
# estable), no por el pearson single-seed. Ver la seccion A5 del notebook (celda "winner's curse").
#
# Se barre arquitectura/optimizacion y el PESO AUXILIAR del ambiente NO-portada
# (model.params.loss_weights.GY_optimal): el peso de la cabeza drought (portada) queda anclado
# en 1.0 en el config base y el sweep busca cuanta señal del ambiente optimal ayuda a drought.
# OJO (memoria): la cabeza LINEAL (hidden_dims: []) NO supera a GBLUP -> el grid arranca en
# tronco no-lineal. max_epochs SI se barre (sin early stopping con un solo ano de train).
#
# Uso:
#   wandb sweep configs/sweep_mlp_multienv.yaml   # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en tmux

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_mlp_multienv_pearsonDrought_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 200

metric:
  name: pearson_r_GY
  goal: maximize

parameters:
  # --- arquitectura (tronco NO-LINEAL; la variante lineal pierde contra GBLUP) ---
  model.params.hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [512]
      - [128, 64]
      - [256, 128]
      - [512, 256]
      - [256, 128, 64]
  model.params.activation:
    values: [relu, gelu, leaky_relu, elu, tanh]
  model.params.batchnorm:
    values: [true, false]
  # --- regularizacion (clave en p >> n) ---
  model.params.dropout:
    distribution: uniform
    min: 0.0
    max: 0.7
  model.params.input_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  model.params.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  # --- optimizacion ---
  model.params.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  model.params.batch_size:
    values: [0, 32, 64, 128]      # 0 = full-batch (r sobre todo el train)
  model.params.max_epochs:
    distribution: int_uniform
    min: 20
    max: 400
  # --- peso auxiliar del ambiente NO-portada (drought anclado en 1.0 en el config base) ---
  model.params.loss_weights.GY_optimal:
    distribution: uniform
    min: 0.0
    max: 1.5

# --config fijo (sin ${args}): argparse de train.py solo ve --config; los HP barridos llegan
# por wandb.config (merge dot-notation en train.py).
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_mlp_multienv_GY_2017_to_2018.yaml
