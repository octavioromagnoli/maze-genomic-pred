# GBLUP — EXPERIMENTO de cierre: train SOLO 2019 -> predecir 2020.
#
# OJO: usa el holdout 2020 (regla 3: intocable hasta el cierre) y entrena con un
# único año. Experimento explícito, no evaluación de dev. lambda_0 por REML.

experiment:
  name: gblup_reml_2019_to_2020
  description: >
    GBLUP entrenado únicamente con 2019 y evaluado sobre 2020 (holdout).
    lambda_0 = sigma_E^2/sigma_u^2 por REML. Predicción por la fórmula
    hat-matrix del paper.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2020            # año a predecir (holdout 2020)
  train_years: [2019]       # override: train SOLO con 2019
  holdout_test_year: null   # no excluir 2020: es el target
  enforce_disjoint_lines: true

model:
  name: gblup
  params:
    lambda_method: reml

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: true
  name: gblup-reml-2019-to-2020
  aliases: [latest]

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [gblup, reml, closure, train2019, test2020]
