# MLP MULTITASK — REPORTE: train 2017+2018 -> predecir 2019 (dev, NO toca el holdout 2020).
# Arm completo del ablation: GY + PH + AD. Se compara, POR trait, contra el GBLUP del trait
# (configs/exp_gblup_2017_2018_to_2019*.yaml) y contra el MLP univariado del mismo trait.
#
# Los HP de model.params son los BASE; para el reporte final el notebook los pisa con los
# ganadores del sweep (configs/sweep_mlp_multitask.yaml, seleccionado en 2017->2018) vía
# best_config_from_sweep. Igual corre standalone con `python scripts/train.py --config ...`.

experiment:
  name: mlp_multitask_2017_2018_to_2019
  description: >
    MLP multitask (GY+PH+AD, ambiente optimo) entrenado con 2017+2018 y evaluado en 2019.
    Arm completo del ablation multitask. 2020 queda como holdout intocable.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  targets: [GY, PH, AD]
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2019            # ano a predecir (reporte)
  train_years: [2017, 2018] # train explicito
  holdout_test_year: 2020   # 2020 fuera (intocable)
  enforce_disjoint_lines: true

model:
  name: mlp_multitask
  params:
    hidden_dims: [128]
    dropout: 0.5
    input_dropout: 0.3
    activation: relu
    batchnorm: false
    lr: 0.0005
    weight_decay: 0.001
    batch_size: 64
    max_epochs: 100
    loss: pearson
    loss_weights:
      GY: 1.0
      PH: 0.5
      AD: 0.5
    patience: null            # sin early stopping (max_epochs fijo / de sweep)
    standardize_inputs: true
    standardize_target: true
    random_state: 575
    device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: true
  name: mlp-multitask-2017-2018-to-2019
  aliases: [latest]

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [mlp, multitask, nn, pytorch, dev, train2017-2018, val2019, GY, PH, AD, optimal, ablation]
