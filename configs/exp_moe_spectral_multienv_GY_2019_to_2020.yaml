# MoE con CLUSTERING ESPECTRAL sobre G + backbone GBLUP (residuo) + ruteo soft KNN en G_test,train.
# Cross-cycle: entrena SOLO con 2019 y evalua en 2020 (espeja exp_moe_gblup_multienv_GY_2019_to_2020,
# NO el cierre final). min_cluster_size bajado a 150 porque 2019 solo tiene ~722 lineas (con 250 los
# 4 clusters de ~180 caerian todos a fallback). Ojo: predecir 2020 desde un solo ciclo da accuracy
# baja/nula (cero overlap GID 2019-2020 + deriva de sequia). HP de expert heredado del hard ganador.
#
# Referencias mismo fold (train2019 -> val2020):
#   - GBLUP:                    optimal 0.179, drought 0.041
#   - MoE ruteo-en-û soft:      optimal 0.141, drought 0.040

experiment:
  name: moe_spectral_multienv_GY_2019_to_2020
  description: >
    MoE con clustering espectral sobre G, backbone GBLUP + expertos sobre el residuo, ruteo soft por
    KNN en G_test,train. Entrena SOLO con 2019 y evalua en 2020 (cross-cycle). 2020 aca es
    evaluacion, no el cierre final.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  multienv: true
  target: GY
  envs: [optimal, drought]
  cover_env: drought

cv:
  scheme: fixed_temporal
  val_year: 2020
  train_years: [2019]
  holdout_test_year: null
  enforce_disjoint_lines: true

model:
  name: moe_spectral_multitask
  params:
    gating:
      gblup:
        lambda_method: reml
      n_clusters: 4
      affinity_clip: true
      assign_labels: kmeans
      n_init: 10
      min_cluster_size: 150     # bajado (2019 ~722 lineas) para que los clusters conserven experto
      global_fallback: true
      random_state: 575
      k_neighbors: 10
    expert:
      n_models: 5
      seed_step: 1000
      inner:
        hidden_dims: [128]
        dropout: 0.2234
        input_dropout: 0.0327
        activation: leaky_relu
        batchnorm: false
        lr: 0.00101
        weight_decay: 3.93e-05
        batch_size: 64
        max_epochs: 133
        loss: pearson
        loss_weights:
          GY_optimal: 1.0
          GY_drought: 1.0
        patience: null
        standardize_inputs: true
        standardize_target: true
        random_state: 575
        device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: offline
  tags: [moe, spectral, gblup-backbone, residual, knn-G, multienv, multitask, cross-cycle, train2019, val2020, GY, optimal, drought]
