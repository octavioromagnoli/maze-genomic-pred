# Sweep BAYESIANO del STACKING ADITIVO GBLUP + RED sobre el residual (GY - y_gblup).
# Optimiza el PEARSON de la prediccion COMPUESTA (gblup + red) en val 2018 (pearson_r_mean,
# regla 5), MAXIMIZAR. Con el split fijo hay un unico fold de scoring, asi que pearson_r_mean ==
# Pearson de la prediccion final en 2018. train.py lo deja en run.summary (ruta single-task), que
# es lo que lee el controller.
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base). Se elige el mejor HP
# sobre 2018 sin tocar 2019 -> sin winner's curse sobre el set de reporte. El reporte final
# (reentrenar 2017+2018 -> 2019, comparado contra GBLUP) es un paso posterior en el notebook con
# los HP ganadores; 2020 sellado. NO poner cv.* ni data.* aca (reglas 2 y 3): viven en el config base.
#
# Se barren los HP de la RED bajo model.params.mlp.* (las claves anidadas de 3 niveles funcionan:
# set_nested desanida igual que en sweep_mlp_multitask con model.params.loss_weights.PH). La base
# GBLUP queda fija (lambda_method: reml en el config base) para que el sweep explore puramente que
# red captura mejor el residual de una base lineal fija.
#
# Capacidad sesgada a MODESTA y regularizacion algo mas fuerte que el MLP base: el residual es
# señal debil y ruidosa, sobreajusta facil. loss ∈ {mse, pearson_mse} (NUNCA pearson pura: la suma
# es aditiva y pearson pura descalibra la escala). max_epochs SI se barre (sin early stopping con
# un solo año de train, el numero de epocas es un HP, como n_estimators en XGBoost).
#
# Uso:
#   wandb login                                   # una vez (controller online)
#   wandb sweep configs/sweep_gblup_residual.yaml # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en tmux

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_gblup_residual_pearson_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 200

metric:
  name: pearson_r_mean
  goal: maximize

parameters:
  model.params.mlp.hidden_dims:
    values:
      - [32]
      - [64]
      - [128]
      - [256]
      - [128, 64]
      - [256, 128]
      - [256, 128, 64]
      - [2048, 1024, 512, 256]
  model.params.mlp.activation:
    values: [relu, gelu, leaky_relu, elu, tanh]
  model.params.mlp.batchnorm:
    values: [true, false]
  # --- regularizacion (clave en p >> n y mas todavia sobre un residual ruidoso) ---
  model.params.mlp.dropout:
    distribution: uniform
    min: 0.0
    max: 0.7
  model.params.mlp.input_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  model.params.mlp.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.1
  # --- optimizacion ---
  model.params.mlp.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  model.params.mlp.batch_size:
    values: [0, 32, 64, 128]      # 0 = full-batch (residual sobre todo el train)
  model.params.mlp.max_epochs:
    distribution: int_uniform
    min: 20
    max: 400
  # --- perdida sobre el residual: NUNCA pearson pura (descalibra la suma aditiva) ---
  model.params.mlp.loss:
    values: [mse, pearson_mse]
  model.params.mlp.mse_weight:    # solo aplica con loss=pearson_mse; no-op con loss=mse
    distribution: uniform
    min: 0.1
    max: 1.0
  # opcional: barrer tambien la base lineal
  # model.params.gblup.lambda_method:
  #   values: [reml, cv]

# --config fijo (sin ${args}): argparse de train.py solo ve --config y los HP barridos llegan
# por wandb.config (merge dot-notation en train.py).
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_gblup_residual_2017_to_2018.yaml
