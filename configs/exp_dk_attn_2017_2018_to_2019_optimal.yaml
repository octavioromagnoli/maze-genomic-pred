# DEEP KERNEL / ATENCION SOBRE EL TRAIN — CONFIRM 2019 (OPTIMAL).
#
# Igual que la variante drought pero env: optimal. Kernel relacional aprendido supervisado que
# generaliza GBLUP. Reentrena 2017+2018 -> val 2019. Compara contra GBLUP-optimal (0.315).
# CAVEAT: en optimal GBLUP esta en el techo; ver si el kernel aprendido al menos lo iguala.
# 2020 SELLADO. HP = defaults razonables (no barridos aun).
#
#   python scripts/train.py --config configs/exp_dk_attn_2017_2018_to_2019_optimal.yaml

experiment:
  name: dk_attn_2017_2018_to_2019_optimal
  description: >
    Deep kernel / atencion sobre el train para GY en OPTIMAL: encoder phi(x) + atencion coseno sobre
    los fenotipos del train (kernel aprendido supervisado). Leave-one-out por linea. Reentrena
    2017+2018 -> val 2019. Confirm honesto vs GBLUP-optimal (techo alto). 2020 sellado.

seed: 575

data:
  geno_csv: data/Geno_data.csv
  pheno_csv: data/Pheno_data.csv
  target: GY
  env: optimal

cv:
  scheme: fixed_temporal
  val_year: 2019
  train_years: [2017, 2018]
  holdout_test_year: 2020
  enforce_disjoint_lines: true

model:
  name: deep_kernel_attn
  params:
    embed_dim: 64
    hidden_dims: [512]
    dropout: 0.3
    input_dropout: 0.3
    activation: relu
    batchnorm: false
    cosine: true
    tau: 0.1
    lr: 0.001
    weight_decay: 0.0001
    max_epochs: 300
    standardize_inputs: true
    standardize_target: true
    random_state: 575
    device: auto

bootstrap:
  enabled: true
  n_boot: 1000
  alpha: 0.05

artifacts:
  save_model: false

wandb:
  project: maze-genomic-pred
  entity: null
  mode: online
  tags: [deep-kernel, attention, relational, confirm, train20172018, val2019, GY, optimal]
