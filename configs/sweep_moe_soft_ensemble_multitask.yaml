# Sweep BAYESIANO del ENSEMBLE de seeds del SOFT MoE MULTITASK (GY+PH+AD, optimal), optimizando el
# PEARSON DE GY DEL ENSEMBLE (pearson_r_GY), NO el de una seed. Cada trial entrena n_models redes y
# promedia -> el numero que optimiza el sweep es estable (anti winner's curse) y el modelo final
# desplegado ES ese ensemble. Barre el bloque soft-MoE (K, temperatura, load-balancing, gate) + la
# arquitectura/regularizacion/optimizacion del backbone + los pesos aux (PH, AD; GY anclado en 1.0),
# TODO bajo model.params.inner.* (n_models/seed_step/inner_name quedan fijos en el config base).
#
# SELECCION HONESTA: train 2017 -> val 2018 (clavado en el config base, sin tocar 2019). El reporte
# final (reentrenar 2017+2018 -> 2019 vs GBLUP / single-seed / MT global) es un paso posterior en el
# notebook con los HP ganadores; 2020 sellado. NO tocar cv.* ni data.* (reglas 2 y 3).
#
# COSTO: cada trial entrena n_models (=5) redes -> ~5x mas lento que el sweep single-seed. Por eso
# run_cap baja de 120 a 60 (mismo orden de wall-clock). Si es muy caro: bajar n_models a 3 en el
# base. set_nested soporta las claves anidadas (model.params.inner.loss_weights.PH).
#
# Uso:
#   wandb login
#   wandb sweep configs/sweep_moe_soft_ensemble_multitask.yaml     # imprime el <sweep_id>
#   WANDB_MODE=online wandb agent oromagnoli-/maze-genomic-pred/<sweep_id>   # en screen

entity: oromagnoli-
project: maze-genomic-pred
name: sweep_moe_soft_ensemble_multitask_pearsonGY_2017_to_2018
program: scripts/train.py
method: bayes
run_cap: 60

metric:
  name: pearson_r_GY          # ahora es el Pearson de GY DEL ENSEMBLE (estable, no de una seed)
  goal: maximize

parameters:
  # --- soft mixture of experts: lo especifico de este camino ---
  model.params.inner.n_experts:
    values: [2, 4, 8]              # K expertos que el gate mezcla
  model.params.inner.gate_tau:
    distribution: uniform         # temperatura del softmax del gate (>1 = mezcla mas blanda)
    min: 0.5
    max: 3.0
  model.params.inner.lb_coef:
    distribution: log_uniform_values  # coef de la load-balancing loss (Switch)
    min: 0.0001
    max: 0.1
  model.params.inner.gate_hidden_dim:
    values: [0, 32]               # 0 => gate lineal Linear(h, K); 32 => una capa oculta
  # --- backbone compartido: arquitectura del tronco (mismo bloque que la MTL) ---
  model.params.inner.hidden_dims:
    values:
      - [64]
      - [128]
      - [256]
      - [128, 64]
      - [256, 128]
  model.params.inner.activation:
    values: [relu, gelu, leaky_relu]
  model.params.inner.batchnorm:
    values: [true, false]
  # --- backbone: regularizacion (clave en p >> n) ---
  model.params.inner.dropout:
    distribution: uniform
    min: 0.0
    max: 0.7
  model.params.inner.input_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  model.params.inner.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.01
  # --- backbone: optimizacion ---
  model.params.inner.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  model.params.inner.batch_size:
    values: [0, 32, 64]           # 0 = full-batch
  model.params.inner.max_epochs:
    distribution: int_uniform
    min: 20
    max: 300
  # --- pesos auxiliares de la loss (GY anclado en 1.0 en el config base) ---
  model.params.inner.loss_weights.PH:
    distribution: uniform
    min: 0.0
    max: 1.0
  model.params.inner.loss_weights.AD:
    distribution: uniform
    min: 0.0
    max: 1.0

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - configs/exp_moe_soft_ensemble_multitask_2017_to_2018.yaml
