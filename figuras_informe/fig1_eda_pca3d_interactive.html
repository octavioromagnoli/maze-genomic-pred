<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCA 3D interactivo - 2017-2020</title>
<style>
:root {
  --bg:#f7f6f0;
  --panel:#fffdf8;
  --ink:#1a211b;
  --muted:#5e695f;
  --line:#d9dccf;
  --accent:#1f8a7c;
  --shadow:0 10px 28px rgba(25,34,28,.09);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
}
.wrap {
  min-height:100vh;
  display:grid;
  grid-template-rows:auto 1fr;
}
header {
  display:flex;
  gap:1rem;
  justify-content:space-between;
  align-items:flex-end;
  padding:1rem clamp(1rem, 3vw, 2rem);
  border-bottom:1px solid var(--line);
  background:rgba(255,253,248,.86);
}
h1 {
  margin:.15rem 0 0;
  font-size:clamp(1.15rem, 2vw, 1.65rem);
  line-height:1.15;
  font-weight:750;
  letter-spacing:0;
}
.meta {
  margin:0;
  color:var(--muted);
  font-size:.86rem;
}
.tools {
  display:flex;
  gap:.5rem;
  align-items:center;
  flex-wrap:wrap;
  justify-content:flex-end;
}
button {
  appearance:none;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  min-height:2rem;
  padding:.35rem .7rem;
  border-radius:6px;
  font:inherit;
  font-size:.86rem;
  cursor:pointer;
}
button.active {
  border-color:var(--accent);
  color:var(--accent);
  background:#e9f4f1;
}
main {
  position:relative;
  min-height:0;
  overflow:hidden;
}
canvas {
  display:block;
  width:100%;
  height:100%;
  cursor:grab;
  background:linear-gradient(180deg,#fffdf8 0%,#f2f0e7 100%);
}
canvas:active { cursor:grabbing; }
.hud {
  position:absolute;
  left:1rem;
  bottom:1rem;
  max-width:min(34rem, calc(100% - 2rem));
  background:rgba(255,253,248,.92);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:.75rem .85rem;
  color:var(--muted);
  font-size:.82rem;
  line-height:1.45;
}
.hud b { color:var(--ink); }
.tip {
  position:absolute;
  z-index:5;
  pointer-events:none;
  display:none;
  background:#172019;
  color:#fff;
  border-radius:6px;
  padding:.45rem .55rem;
  font-size:.78rem;
  box-shadow:var(--shadow);
  white-space:nowrap;
}
.legend {
  display:flex;
  gap:.8rem;
  flex-wrap:wrap;
  margin-top:.35rem;
}
.swatch {
  display:inline-block;
  width:.75rem;
  height:.75rem;
  border-radius:50%;
  margin-right:.28rem;
  vertical-align:-.08rem;
}
@media (max-width:720px) {
  header { align-items:flex-start; flex-direction:column; }
  .tools { justify-content:flex-start; }
  .hud { font-size:.76rem; }
}
</style>
</head>

</div>

4,"pc3":4.407101},{"gid":"1272464","year":2020,"pc1":2.199457,"pc2":2.897301,"pc3":4.68336},{"gid":"1272465","year":2020,"pc1":1.358964,"pc2":2.660129,"pc3":4.157121},{"gid":"1272466","year":2020,"pc1":1.670838,"pc2":4.540235,"pc3":5.022243},{"gid":"1272467","year":2020,"pc1":-0.342688,"pc2":4.188887,"pc3":2.415823},{"gid":"1272468","year":2020,"pc1":2.090582,"pc2":3.254403,"pc3":4.748355},{"gid":"1272469","year":2020,"pc1":2.090367,"pc2":3.434063,"pc3":4.843359},{"gid":"1272470","year":2020,"pc1":1.841174,"pc2":1.872697,"pc3":4.85039},{"gid":"1272471","year":2020,"pc1":2.160494,"pc2":2.826216,"pc3":4.269693},{"gid":"1272472","year":2020,"pc1":1.773978,"pc2":2.700293,"pc3":4.966783},{"gid":"1272473","year":2020,"pc1":2.149433,"pc2":4.347376,"pc3":4.280299},{"gid":"1272474","year":2020,"pc1":1.409172,"pc2":2.687643,"pc3":5.021463},{"gid":"1272475","year":2020,"pc1":1.106204,"pc2":2.521336,"pc3":4.937477},{"gid":"1272476","year":2020,"pc1":1.773354,"pc2":2.851638,"pc3":4.427711},{"gid":"1272477","year":2020,"pc1":2.057134,"pc2":2.123,"pc3":4.112604},{"gid":"1272478","year":2020,"pc1":1.164803,"pc2":2.256661,"pc3":4.400401},{"gid":"1272479","year":2020,"pc1":1.508378,"pc2":3.425026,"pc3":4.925937},{"gid":"1272480","year":2020,"pc1":-0.308522,"pc2":-0.668197,"pc3":4.101073},{"gid":"1272481","year":2020,"pc1":1.71188,"pc2":3.54431,"pc3":5.185803},{"gid":"1272482","year":2020,"pc1":-0.043968,"pc2":0.336524,"pc3":3.83772},{"gid":"1272483","year":2020,"pc1":1.470054,"pc2":2.32369,"pc3":4.525425},{"gid":"1272484","year":2020,"pc1":2.604933,"pc2":2.401683,"pc3":4.245796},{"gid":"1272485","year":2020,"pc1":1.167295,"pc2":2.429763,"pc3":4.482067},{"gid":"1272486","year":2020,"pc1":1.744553,"pc2":2.556212,"pc3":4.560232},{"gid":"1272487","year":2020,"pc1":1.151614,"pc2":2.520962,"pc3":4.726692},{"gid":"1272488","year":2020,"pc1":1.545577,"pc2":2.159816,"pc3":4.606644},{"gid":"1272489","year":2020,"pc1":2.346723,"pc2":2.091474,"pc3":4.524903},{"gid":"1272490","year":2020,"pc1":0.873007,"pc2":2.337306,"pc3":5.171402},{"gid":"1272491","year":2020,"pc1":1.907622,"pc2":1.68238,"pc3":4.031376},{"gid":"1272493","year":2020,"pc1":0.831871,"pc2":4.033381,"pc3":4.665347},{"gid":"1272494","year":2020,"pc1":1.499793,"pc2":3.093655,"pc3":4.619778},{"gid":"1272495","year":2020,"pc1":2.443741,"pc2":3.872056,"pc3":4.538719},{"gid":"1272496","year":2020,"pc1":1.460907,"pc2":3.002111,"pc3":4.062591},{"gid":"1272497","year":2020,"pc1":1.88321,"pc2":3.626059,"pc3":5.368764},{"gid":"1272498","year":2020,"pc1":1.03547,"pc2":3.152771,"pc3":4.625541},{"gid":"1302788","year":2020,"pc1":4.458084,"pc2":1.339284,"pc3":1.074722},{"gid":"1302790","year":2020,"pc1":7.693281,"pc2":-11.589732,"pc3":-1.256021}],"centroids":[{"year":2017,"n":901,"pc1":-8.005423,"pc2":0.866612,"pc3":-3.246081},{"year":2018,"n":1419,"pc1":4.686259,"pc2":-0.899224,"pc3":-0.265973},{"year":2019,"n":722,"pc1":0.779896,"pc2":0.685847,"pc3":4.573592},{"year":2020,"n":486,"pc1":1.458679,"pc2":2.64007,"pc3":4.894471}],"drift":[{"pair":"2017 vs 2018","n":2320,"auc":0.951},{"pair":"2018 vs 2019","n":2141,"auc":0.926},{"pair":"2017 vs 2019","n":1623,"auc":0.976}],"evr":[0.063443,0.051005,0.039452],"colors":{"2017":"#1b6ca8","2018":"#e07a2f","2019":"#2a9d5c","2020":"#7b4ab2"},"years":[2017,2018,2019,2020],"fitYears":[2017,2018,2019]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("pca-data").textContent);
  const canvas = document.getElementById("plot");
  const ctx = canvas.getContext("2d");
  const tip = document.getElementById("tip");
  const hud = document.getElementById("hud");
  const state = {
    rotX: -0.32,
    rotY: -0.9,
    zoom: 1,
    panX: 0,
    panY: 0,
    dragging: false,
    lastX: 0,
    lastY: 0,
    showCentroids: true,
    visible: new Set(data.years.map(String)),
    projected: []
  };
  const cubeLabels = [
    { name: `PC1 (${(data.evr[0] * 100).toFixed(1)}%)`, at: [0, -1, -1], color: "#4d6675" },
    { name: `PC2 (${(data.evr[1] * 100).toFixed(1)}%)`, at: [-1, 0, -1], color: "#6b7046" },
    { name: `PC3 (${(data.evr[2] * 100).toFixed(1)}%)`, at: [-1, -1, 0], color: "#70505c" }
  ];
  const maxAbs = Math.max(
    ...data.points.flatMap(p => [Math.abs(p.pc1), Math.abs(p.pc2), Math.abs(p.pc3)]),
    ...data.centroids.flatMap(p => [Math.abs(p.pc1), Math.abs(p.pc2), Math.abs(p.pc3)])
  ) || 1;
  const counts = data.points.reduce((acc, p) => {
    acc[p.year] = (acc[p.year] || 0) + 1;
    return acc;
  }, {});

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function rotatePoint(p) {
    const cy = Math.cos(state.rotY), sy = Math.sin(state.rotY);
    const cx = Math.cos(state.rotX), sx = Math.sin(state.rotX);
    const x1 = cy * p[0] + sy * p[2];
    const z1 = -sy * p[0] + cy * p[2];
    const y1 = cx * p[1] - sx * z1;
    const z2 = sx * p[1] + cx * z1;
    return [x1, y1, z2];
  }

  function project(x, y, z) {
    const rect = canvas.getBoundingClientRect();
    const r = rotatePoint([x, y, z]);
    const perspective = 1 / (1 + (r[2] / (maxAbs * 7)));
    const scale = Math.min(rect.width, rect.height) * 0.36 * state.zoom / maxAbs;
    return {
      x: rect.width / 2 + state.panX + r[0] * scale * perspective,
      y: rect.height / 2 + state.panY - r[1] * scale * perspective,
      z: r[2],
      perspective
    };
  }

  function drawCube() {
    const L = maxAbs * 1.08;
    const corners = [
      [-L, -L, -L], [ L, -L, -L], [ L,  L, -L], [-L,  L, -L],
      [-L, -L,  L], [ L, -L,  L], [ L,  L,  L], [-L,  L,  L]
    ];
    const edges = [
      [0, 1], [1, 2], [2, 3], [3, 0],
      [4, 5], [5, 6], [6, 7], [7, 4],
      [0, 4], [1, 5], [2, 6], [3, 7]
    ].map(edge => {
      const a = project(...corners[edge[0]]);
      const b = project(...corners[edge[1]]);
      return { a, b, z: (a.z + b.z) / 2 };
    }).sort((a, b) => a.z - b.z);
    ctx.save();
    ctx.lineWidth = 1.15;
    ctx.strokeStyle = "#899287";
    for (const edge of edges) {
      ctx.globalAlpha = 0.4 + 0.22 * ((edge.z + L) / (2 * L));
      ctx.beginPath();
      ctx.moveTo(edge.a.x, edge.a.y);
      ctx.lineTo(edge.b.x, edge.b.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.font = "12px system-ui, sans-serif";
    ctx.textBaseline = "middle";
    cubeLabels.forEach(label => {
      const p = project(label.at[0] * L, label.at[1] * L, label.at[2] * L);
      ctx.fillStyle = label.color;
      ctx.fillText(label.name, p.x + 7, p.y);
    });
    ctx.restore();
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    drawCube();
    const projected = [];
    for (const p of data.points) {
      if (!state.visible.has(String(p.year))) continue;
      const q = project(p.pc1, p.pc2, p.pc3);
      projected.push({ ...q, kind: "point", raw: p });
    }
    if (state.showCentroids) {
      for (const p of data.centroids) {
        if (!state.visible.has(String(p.year))) continue;
        const q = project(p.pc1, p.pc2, p.pc3);
        projected.push({ ...q, kind: "centroid", raw: p });
      }
    }
    projected.sort((a, b) => a.z - b.z);
    state.projected = projected;
    for (const p of projected) {
      const color = data.colors[String(p.raw.year)];
      if (p.kind === "centroid") {
        const s = 8.5 * p.perspective;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = color;
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.rect(-s, -s, s * 2, s * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else {
        const radius = Math.max(1.5, 2.3 * p.perspective);
        ctx.fillStyle = color;
        ctx.strokeStyle = "#1d261f";
        ctx.lineWidth = Math.max(0.35, 0.45 * p.perspective);
        ctx.globalAlpha = 0.72;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.82;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  function updateHud() {
    const drift = data.drift.map(d => `${d.pair} <b>${d.auc.toFixed(2)}</b>`).join(" · ");
    const legend = Object.entries(data.colors).map(([year, color]) =>
      `<span><i class="swatch" style="background:${color}"></i>${year} n=${counts[year] || 0}</span>`
    ).join("");
    hud.innerHTML = `<b>Arrastrar</b>: rotar · <b>rueda</b>: zoom · <b>Shift + arrastrar</b>: mover<br>` +
      `PCA fit: <b>${data.fitYears.join("-")}</b> · ` +
      `PC1-3: <b>${(data.evr[0] * 100).toFixed(1)}%</b> / <b>${(data.evr[1] * 100).toFixed(1)}%</b> / <b>${(data.evr[2] * 100).toFixed(1)}%</b> · ` +
      `Drift CV-AUC: ${drift}<div class="legend">${legend}</div>`;
  }

  function showTip(evt) {
    const rect = canvas.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;
    let best = null;
    let bestD = Infinity;
    for (const p of state.projected) {
      const dx = p.x - x;
      const dy = p.y - y;
      const d = dx * dx + dy * dy;
      if (d < bestD) {
        bestD = d;
        best = p;
      }
    }
    if (!best || bestD > 100) {
      tip.style.display = "none";
      return;
    }
    const r = best.raw;
    tip.style.display = "block";
    tip.style.left = `${x + 12}px`;
    tip.style.top = `${y + 12}px`;
    tip.innerHTML = best.kind === "centroid"
      ? `Centroide ${r.year}<br>n=${r.n} · PC=(${r.pc1.toFixed(2)}, ${r.pc2.toFixed(2)}, ${r.pc3.toFixed(2)})`
      : `GID ${r.gid} · ${r.year}<br>PC=(${r.pc1.toFixed(2)}, ${r.pc2.toFixed(2)}, ${r.pc3.toFixed(2)})`;
  }

  canvas.addEventListener("pointerdown", evt => {
    state.dragging = true;
    state.lastX = evt.clientX;
    state.lastY = evt.clientY;
    canvas.setPointerCapture(evt.pointerId);
  });
  canvas.addEventListener("pointerup", evt => {
    state.dragging = false;
    try { canvas.releasePointerCapture(evt.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointerleave", () => {
    tip.style.display = "none";
  });
  canvas.addEventListener("pointermove", evt => {
    if (state.dragging) {
      const dx = evt.clientX - state.lastX;
      const dy = evt.clientY - state.lastY;
      state.lastX = evt.clientX;
      state.lastY = evt.clientY;
      if (evt.shiftKey) {
        state.panX += dx;
        state.panY += dy;
      } else {
        state.rotY += dx * 0.008;
        state.rotX += dy * 0.008;
        state.rotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, state.rotX));
      }
      draw();
    } else {
      showTip(evt);
    }
  });
  canvas.addEventListener("wheel", evt => {
    evt.preventDefault();
    const factor = Math.exp(-evt.deltaY * 0.001);
    state.zoom = Math.max(0.35, Math.min(4.5, state.zoom * factor));
    draw();
  }, { passive: false });
  document.getElementById("reset").addEventListener("click", () => {
    state.rotX = -0.32;
    state.rotY = -0.9;
    state.zoom = 1;
    state.panX = 0;
    state.panY = 0;
    draw();
  });
  document.getElementById("centroids").addEventListener("click", evt => {
    state.showCentroids = !state.showCentroids;
    evt.currentTarget.classList.toggle("active", state.showCentroids);
    tip.style.display = "none";
    draw();
  });
  document.querySelectorAll("button.year").forEach(btn => {
    btn.addEventListener("click", () => {
      const year = btn.dataset.year;
      if (state.visible.has(year)) {
        if (state.visible.size === 1) return;
        state.visible.delete(year);
        btn.classList.remove("active");
      } else {
        state.visible.add(year);
        btn.classList.add("active");
      }
      draw();
    });
  });
  window.addEventListener("resize", resize);
  updateHud();
  resize();
})();
</script>
